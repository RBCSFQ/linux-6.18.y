name: Compile SY910 WiFi Module for 6.18.18.c821-trim (v3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: RBCSFQ/linux-6.18.y
          ref: main
          fetch-depth: 0

      - name: Install dependencies (GCC 12 to match ophub)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12-aarch64-linux-gnu flex bison bc python3
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ar aarch64-linux-gnu-gcc-ar /usr/bin/aarch64-linux-gnu-gcc-ar-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-nm aarch64-linux-gnu-gcc-nm /usr/bin/aarch64-linux-gnu-gcc-nm-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ranlib aarch64-linux-gnu-gcc-ranlib /usr/bin/aarch64-linux-gnu-gcc-ranlib-12 100
          aarch64-linux-gnu-gcc --version

      - name: Download ophub kernel headers (contains Module.symvers + scripts)
        run: |
          # ophub publishes kernel source tarballs at kernel_fnnas release
          # These contain Module.symvers and full headers from ophub's build
          KERNEL_TARBALL="https://github.com/ophub/fnnas/releases/download/kernel_fnnas/6.18.18-rockchip.tar.gz"

          echo "=== Downloading ophub kernel tarball ==="
          wget -q "$KERNEL_TARBALL" -O ophub-kernel.tar.gz || {
            echo "WARNING: 6.18.18-rockchip.tar.gz not found, trying alternative names..."
            # Try with different naming
            wget -q "https://github.com/ophub/fnnas/releases/download/kernel_fnnas/6.18.18.tar.gz" -O ophub-kernel.tar.gz || {
              echo "Listing available files at kernel_fnnas release..."
              wget -q -O - "https://github.com/ophub/fnnas/releases/tag/kernel_fnnas" | grep -oP 'href="[^"]*\.tar\.gz"' | head -20
              exit 1
            }
          }
          echo "=== Extracting ophub kernel tree ==="
          tar xzf ophub-kernel.tar.gz
          ls -la
          # ophub tarball typically extracts to 6.18.18-rockchip/
          echo "=== Looking for kernel Makefile ==="
          ls */Makefile 2>/dev/null || true
          # Find the kernel source directory (may be nested)
          OPHUB_KDIR=$(find . -maxdepth 3 -name "Makefile" -exec grep -l "VERSION = 6" {} \; 2>/dev/null | head -1 | xargs dirname)
          if [ -z "$OPHUB_KDIR" ]; then
            # Search for any directory with kernel Makefile
            OPHUB_KDIR=$(find . -maxdepth 3 -type f -name "Makefile" 2>/dev/null | head -1 | xargs dirname)
          fi
          echo "OPHUB_KDIR=$OPHUB_KDIR"
          echo "OPHUB_KDIR=$OPHUB_KDIR" >> $GITHUB_ENV

          # Check for critical files
          echo "=== Checking for Module.symvers ==="
          find . -name "Module.symvers" -ls 2>/dev/null || echo "WARNING: No Module.symvers found"
          echo "=== Checking for scripts/kconfig ==="
          find . -path "*/scripts/kconfig/Makefile" -ls 2>/dev/null || echo "WARNING: no scripts/kconfig"

      - name: Fix DTS
        run: |
          DTS_DIR=arch/arm64/boot/dts/rockchip
          DTS=$DTS_DIR/rk3528-sy910.dts
          sed -i '/rk3528-ddr4-lp3-v11/d' $DTS
          for LABEL in cpu0 gpu display_subsystem vop vop_mmu hdmi hdmi_in_vop \
                       usb2phy usbdrd30 usbdrd_dwc3 pcie2x1 rng sfc; do
            sed -i '/^&'"$LABEL"' {/,/^};$/d' $DTS
          done
          sed -i '/drm-logo@0 {/,/};$/d' $DTS
          sed -i '/drm-cubic-lut@0 {/,/};$/d' $DTS
          sed -i '/clocks = <&xin24m>;/d' $DTS
          sed -i 's/pcfg_pull_none_schmitt/pcfg_pull_none/g' $DTS
          sed -i '/^[\t ]*reserved-memory {$/,/^[\t ]*};$/d' $DTS
          if ! grep -q 'rk3528-sy910.dtb' $DTS_DIR/Makefile; then
            sed -i '/^dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3528-evb1-ddr4-v10.dtb/a dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3528-sy910.dtb' $DTS_DIR/Makefile
          fi

      - name: Patch unisoc drivers
        run: |
          DRV=drivers/net/wireless/unisoc/unisocwifi
          WCN=drivers/net/wireless/unisoc/unisocwcn
          SDIOHAL=$WCN/sdio/sdiohal_main.c
          SDIO_INT=$WCN/sleep/sdio_int.c
          sed -i '/disable_irq_nosync(irq);/a\        if (!atomic_read(\&sdiohal_get_data()->xmit_start)) { return IRQ_HANDLED; }' $SDIO_INT
          sed -i 's/sdiohal_info("%s wait xmit_cnt:%d/sdiohal_debug("%s wait xmit_cnt:%d/' $SDIOHAL
          sed -i 's/sdiohal_info("%s wait xmit_cnt end/sdiohal_debug("%s wait xmit_cnt end/' $SDIOHAL
          sed -i 's/p_data->pwrseq = true;/p_data->pwrseq = false; \/* RK3528 *\//' $SDIOHAL
          sed -i 's/if (!p_data->pwrseq) {/if (1) { \/* RK3528 always enable *\//' $SDIOHAL
          sed -i 's/cfg80211_new_sta(vif->ndev,/cfg80211_new_sta(\&vif->wdev,/g' $DRV/cfg80211.c 2>/dev/null || true
          sed -i 's/cfg80211_del_sta(vif->ndev,/cfg80211_del_sta(\&vif->wdev,/g' $DRV/cfg80211.c 2>/dev/null || true
          sed -i 's/from_timer(priv, t, scan_timer)/container_of(t, struct sprdwl_priv, scan_timer)/g' $DRV/cfg80211.c 2>/dev/null || true
          sed -i 's/from_timer(ack_info, t, timer)/container_of(t, struct sprdwl_tcp_ack_info, timer)/g' $DRV/tcp_ack.c 2>/dev/null || true
          sed -i 's/from_timer(ba_node, t, reorder_timer)/container_of(t, struct rx_ba_node, reorder_timer)/g' $DRV/reorder.c 2>/dev/null || true
          sed -i 's/from_timer(priv, t, wmmac\.wmmac_edcaf_timer)/container_of(t, struct sprdwl_priv, wmmac.wmmac_edcaf_timer)/g' $DRV/qos.c
          for f in $DRV/cfg80211.c $DRV/tcp_ack.c $DRV/reorder.c $DRV/qos.c; do
            sed -i 's/\bdel_timer_sync\b/timer_delete_sync/g' "$f" 2>/dev/null || true
            sed -i 's/\bsetup_timer\b/timer_setup/g' "$f" 2>/dev/null || true
            sed -i 's/\bdel_timer\b/timer_delete/g' "$f" 2>/dev/null || true
          done
          find $DRV $WCN -name "*.c" -exec sed -i '/^MODULE_IMPORT_NS/d' {} \; 2>/dev/null || true
          echo 'ccflags-y += -DCONFIG_RK_BOARD' >> $WCN/sdio/Makefile
          for d in $DRV $WCN $WCN/sdio $WCN/platform $WCN/sleep; do
            if [ -f "$d/Makefile" ]; then
              echo 'subdir-ccflags-y := -Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types' >> "$d/Makefile" 2>/dev/null || true
            fi
          done

      - name: Configure and prepare kernel tree
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Set version to match ophub
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 18/' Makefile
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = .c821-trim/' Makefile
          head -5 Makefile

          # Use ophub's exact .config from the repo
          cp .github/config-6.18.18.c821-trim .config

          # Inject unisoc symbols
          echo "CONFIG_SPARD_WLAN_SUPPORT=y" >> .config
          echo "CONFIG_RK_WIFI_DEVICE_UWE5621=y" >> .config
          echo "CONFIG_SPRDWL_NG=m" >> .config
          echo "CONFIG_WCN_BOOT=y" >> .config

          make olddefconfig 2>&1 | tail -5

          echo "=== modules_prepare ==="
          make -j$(nproc) modules_prepare 2>&1 | tail -5

          # CRITICAL: Use ophub's Module.symvers if we downloaded it
          if [ -n "$OPHUB_KDIR" ] && [ -f "$OPHUB_KDIR/Module.symvers" ]; then
            echo "=== Copying ophub Module.symvers (has $(wc -l < $OPHUB_KDIR/Module.symvers) entries) ==="
            cp "$OPHUB_KDIR/Module.symvers" ./
            echo "Module.symvers entries: $(wc -l < Module.symvers)"
            # Also copy scripts if missing
            if [ ! -d scripts/kconfig ] && [ -d "$OPHUB_KDIR/scripts/kconfig" ]; then
              echo "=== Copying missing scripts/kconfig from ophub tree ==="
              cp -r "$OPHUB_KDIR/scripts/kconfig" scripts/ 2>/dev/null || true
            fi
          else
            echo "WARNING: No ophub Module.symvers available"
            echo "Building without symbol resolution. Module may have unresolved symbols."
          fi

      - name: Build unisoc modules
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          UNISOC=drivers/net/wireless/unisoc

          echo "=== unisocwcn ==="
          cat $UNISOC/unisocwcn/Makefile | head -5 2>/dev/null || true
          make M=$UNISOC/unisocwcn modules 2>&1 | tail -10 || true

          echo "=== unisocwifi ==="
          cat $UNISOC/unisocwifi/Makefile | head -5 2>/dev/null || true
          make M=$UNISOC/unisocwifi modules 2>&1 | tail -20 || true

          KO_COUNT=$(find $UNISOC -name "*.ko" 2>/dev/null | wc -l)
          echo "=== Module count: $KO_COUNT ==="
          find $UNISOC -name "*.ko" -ls 2>/dev/null || echo "NONE"

          find $UNISOC -name "*.ko" 2>/dev/null | while read ko; do
            echo "=== modinfo $ko ==="
            modinfo "$ko" | grep -E "vermagic|depends|filename|license"
          done

          if [ "$KO_COUNT" -eq 0 ]; then
            echo "FATAL: No modules produced"
            exit 1
          fi

      - name: Build Image and DTB
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) Image dtbs 2>&1 | tail -10
          ls -la arch/arm64/boot/Image || { echo "Image build FAILED"; exit 1; }
          ls -la arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb || { echo "DTB build FAILED"; exit 1; }

      - name: Package output
        run: |
          rm -rf output
          mkdir -p output/modules
          UNISOC=drivers/net/wireless/unisoc
          find $UNISOC -name "*.ko" 2>/dev/null | while read f; do
            dir="$(dirname "$f")"
            mkdir -p "output/modules/$dir"
            cp "$f" "output/modules/$dir/"
          done
          echo "Module count: $(find output/modules -name '*.ko' | wc -l)"
          find output/modules -name "*.ko" | while read ko; do
            basename "$ko"
          done > output/modules/modules.order 2>/dev/null || true
          cp arch/arm64/boot/Image output/
          cp arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb output/
          cd output && zip -r ../rk3528-sy910-wifi-modules.zip .
          echo "Package: $(ls -la ../rk3528-sy910-wifi-modules.zip)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3528-sy910-wifi-modules
          path: rk3528-sy910-wifi-modules.zip

