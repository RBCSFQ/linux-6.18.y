name: Compile W132D Kernel + DTB + WIFI Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc

      - name: Fix DTS GPIOs for W132D (gpio4 -> gpio3)
        run: |
          DTS=arch/arm64/boot/dts/rockchip/rk3528-w132d.dts
          sed -i '/uwe_bsp/,/};/s/&gpio4/&gpio3/g' $DTS
          sed -i '/sdio_pwrseq/,/};/s/&gpio4/&gpio3/g' $DTS
          sed -i '/wireless_wlan/,/};/s/&gpio4/&gpio3/g' $DTS
          sed -i '/wireless_bluetooth/,/};/s/&gpio4/&gpio3/g' $DTS
          echo "=== uwe_bsp block ==="
          sed -n '/uwe_bsp/,/};/p' $DTS | head -15

      - name: Fix dw_mmc-rockchip runtime PM for SDIO stability
        run: |
          sed -i 's/RUNTIME_PM_OPS(dw_mci_rockchip_runtime_suspend, dw_mci_rockchip_runtime_resume, NULL)/RUNTIME_PM_OPS(dw_mci_runtime_suspend, dw_mci_runtime_resume, NULL)/' drivers/mmc/host/dw_mmc-rockchip.c
          sed -i '/\.shutdown\t*= dw_mci_rockchip_shutdown,/d' drivers/mmc/host/dw_mmc-rockchip.c
          echo "=== PM ops fix applied ==="
          grep -n -E 'RUNTIME_PM_OPS|shutdown' drivers/mmc/host/dw_mmc-rockchip.c || true

      - name: Fix unisoc WIFI driver API for 6.18
        run: |
          DRV=drivers/net/wireless/unisoc/unisocwifi
          WCN=drivers/net/wireless/unisoc/unisocwcn
          sed -i 's/cfg80211_new_sta(vif->ndev,/cfg80211_new_sta(&vif->wdev,/g' $DRV/cfg80211.c
          sed -i 's/cfg80211_del_sta(vif->ndev,/cfg80211_del_sta(&vif->wdev,/g' $DRV/cfg80211.c
          sed -i 's/from_timer(priv, t, scan_timer)/container_of(t, struct sprdwl_priv, scan_timer)/g' $DRV/cfg80211.c
          sed -i 's/from_timer(ack_info, t, timer)/container_of(t, struct sprdwl_tcp_ack_info, timer)/g' $DRV/tcp_ack.c
          sed -i 's/from_timer(ba_node, t, reorder_timer)/container_of(t, struct rx_ba_node, reorder_timer)/g' $DRV/reorder.c
          sed -i 's/del_timer_sync(/timer_delete_sync(/g' $DRV/cfg80211.c
          sed -i 's/setup_timer(/timer_setup(/g' $DRV/cfg80211.c
          sed -i 's/del_timer(/timer_delete(/g' $DRV/tcp_ack.c
          sed -i 's/setup_timer(/timer_setup(/g' $DRV/tcp_ack.c
          sed -i 's/del_timer_sync(/timer_delete_sync(/g' $DRV/reorder.c
          sed -i 's/del_timer(/timer_delete(/g' $DRV/reorder.c
          sed -i '703s/.*/	struct sprdwl_wmmac_params *__wmmac = container_of(t, struct sprdwl_wmmac_params, wmmac_edcaf_timer);/' $DRV/qos.c
          sed -i '704s/.*/	struct sprdwl_priv *priv = container_of(__wmmac, struct sprdwl_priv, wmmac);/' $DRV/qos.c
          sed -i 's/del_timer_sync(/timer_delete_sync(/g' $DRV/qos.c
          sed -i 's/setup_timer(/timer_setup(/g' $DRV/qos.c
          sed -i 's/del_timer(/timer_delete(/g' $DRV/qos.c
          echo 'ccflags-y += -DCONFIG_RK_BOARD' >> $WCN/sdio/Makefile
          find $DRV $WCN -name "*.c" -exec sed -i '/^MODULE_IMPORT_NS/d' {} \;
          for d in $DRV $WCN/sdio $WCN/platform; do
            echo 'subdir-ccflags-y := -Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types' >> "$d/Makefile" 2>/dev/null || true
          done
          echo "=== unisocwifi fixes applied ==="

      - name: Fix sdiohal pwrseq blocking sdio_enable_func
        run: |
          SDIOHAL=drivers/net/wireless/unisoc/unisocwcn/sdio/sdiohal_main.c
          sed -i '/p_data->pwrseq = true;/a\tif (IS_ENABLED(CONFIG_RK_BOARD)) p_data->pwrseq = false;' $SDIOHAL
          sed -i 's@if (!p_data->pwrseq) {@if (1) { /* Force func enable for RK3528 */@' $SDIOHAL
          echo "=== sdiohal pwrseq fix applied ==="
          grep -n -E 'Force func enable|p_data->pwrseq = false' $SDIOHAL || true

      - name: Fix sdio_int.c infinite IRQ loop on CMD52 failure
        run: |
          SDIO_INT=drivers/net/wireless/unisoc/unisocwcn/sleep/sdio_int.c
          sed -i '/SLP_MGR_INFO("sdio cmd52 fail, ret-%d", ret);/a\t\t\tatomic_set(&sdio_int.chip_power_on, 0);\n\t\t\tusleep_range(50000, 100000);' $SDIO_INT
          echo "=== sdio_int.c fix applied ==="
          grep -n -A3 "sdio cmd52 fail" $SDIO_INT || true

      - name: Prepare kernel config and compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i 's/obj-.*clk-imx8mp-audiomix.o/#&/' drivers/clk/imx/Makefile
          sed -i 's/obj-.*clk-vbattb.o/#&/' drivers/clk/renesas/Makefile
          make defconfig
          scripts/config --disable CONFIG_DRM_SUN4I
          make -j$(nproc) Image dtbs modules
          ls -la arch/arm64/boot/Image
          ls -la arch/arm64/boot/dts/rockchip/rk3528-w132d.dtb

      - name: Install full module tree
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p modinstall
          make INSTALL_MOD_PATH=./modinstall modules_install
          find modinstall -type l -name build -delete
          find modinstall -type l -name source -delete
          echo "=== Checking for sprdwl_ng.ko ==="
          find modinstall -name "sprdwl_ng.ko" -ls || true

      - name: Package and verify output
        run: |
          mkdir -p output
          cp -v arch/arm64/boot/Image output/Image
          cp -v arch/arm64/boot/dts/rockchip/rk3528-w132d.dtb output/rk3528-w132d.dtb
          cp -r modinstall/lib output/
          echo "=== Top-level output ==="
          ls -la output/
          echo "=== Module tree root ==="
          ls output/lib/modules/
          cd output && zip -r ../rk3528-w132d-kernel.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3528-w132d-kernel
          path: rk3528-w132d-kernel.zip
