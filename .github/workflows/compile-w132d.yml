name: Compile W132D Kernel + DTB + WIFI Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc

      - name: Fix DTS GPIOs for W132D (gpio4 -> gpio3)
        run: |
          DTS=arch/arm64/boot/dts/rockchip/rk3528-w132d.dts
          sed -i '/uwe_bsp/,/};/s/&gpio4/&gpio3/g' $DTS
          sed -i '/sdio_pwrseq/,/};/s/&gpio4/&gpio3/g' $DTS
          sed -i '/wireless_wlan/,/};/s/&gpio4/&gpio3/g' $DTS
          sed -i '/wireless_bluetooth/,/};/s/&gpio4/&gpio3/g' $DTS

      - name: Fix dw_mmc-rockchip runtime PM
        run: |
          sed -i 's/RUNTIME_PM_OPS(dw_mci_rockchip_runtime_suspend, dw_mci_rockchip_runtime_resume, NULL)/RUNTIME_PM_OPS(dw_mci_runtime_suspend, dw_mci_runtime_resume, NULL)/' drivers/mmc/host/dw_mmc-rockchip.c
          sed -i '/\.shutdown\t*= dw_mci_rockchip_shutdown,/d' drivers/mmc/host/dw_mmc-rockchip.c

      - name: Patch unisoc drivers (with firmware write diagnostics)
        run: |
          DRV=drivers/net/wireless/unisoc/unisocwifi
          WCN=drivers/net/wireless/unisoc/unisocwcn
          SDIOHAL=$WCN/sdio/sdiohal_main.c
          SDIO_INT=$WCN/sleep/sdio_int.c
          WCNBOOT=$WCN/platform/wcn_boot.c

          # ============================================================
          # DIAGNOSTIC 1: sdiohal_dt_write - log each call
          # Insert after: unsigned int remainder = len;
          # This is line 933 in the original source
          # ============================================================
          sed -i '/unsigned int remainder = len;/a\        sdiohal_info("DIAG_FW: dt_write enter addr=0x%x len=%u", system_addr, len);' $SDIOHAL
          # After sdio_release_host, log done
          sed -i '/sdio_release_host(p_data->sdio_func\[FUNC_1\]);/a\        sdiohal_info("DIAG_FW: dt_write done remainder=%u ret=%d", remainder, ret);' $SDIOHAL

          # ============================================================
          # DIAGNOSTIC 2: sprdwcn_bus_direct_write_dispack - log progress
          # Insert after the opening brace of the function body (line 948)
          # ============================================================
          sed -i '/static int sprdwcn_bus_direct_write_dispack/,/^{/ { /^{/ a\        WCN_INFO("DIAG_FW: write_dispack enter addr=0x%x buf_size=%zu pkt_max=%zu", addr, buf_size, packet_max_size);
          }' $WCNBOOT
          # Log each chunk write (before sprdwcn_bus_direct_write call)
          sed -i '/ret = sprdwcn_bus_direct_write(addr + offset, kbuf, temp_size);/i\                WCN_INFO("DIAG_FW: chunk offset=%zu temp_size=%zu remain=%zu", offset, temp_size, buf_size - offset);' $WCNBOOT
          # Log exit at OUT label
          sed -i '/^OUT:/a\        WCN_INFO("DIAG_FW: write_dispack exit ret=%d offset=%zu/%zu", ret, offset, buf_size);' $WCNBOOT

          # ============================================================
          # DIAGNOSTIC 3: marlin_firmware_write - log image count
          # ============================================================
          sed -i '/for (i = 0; i < combin_img_count; i++) {/a\                        WCN_INFO("DIAG_FW: img[%d] addr=0x%x size=%u", i, imginfoe[i].addr, imginfoe[i].size);' $WCNBOOT

          # ============================================================
          # Existing fixes (from 5C/5E)
          # ============================================================

          # sdio_int.c: ISR guards
          sed -i '/disable_irq_nosync(irq);/a\        if (!atomic_read(\&sdiohal_get_data()->xmit_start)) { return IRQ_HANDLED; }' $SDIO_INT

          # sdiohal_main.c: suppress "wait xmit_cnt" log spam
          sed -i 's/sdiohal_info("%s wait xmit_cnt:%d/sdiohal_debug("%s wait xmit_cnt:%d/' $SDIOHAL
          sed -i 's/sdiohal_info("%s wait xmit_cnt end/sdiohal_debug("%s wait xmit_cnt end/' $SDIOHAL

          # Force pwrseq=false
          sed -i 's/p_data->pwrseq = true;/p_data->pwrseq = false; \/* RK3528 *\//' $SDIOHAL

          # Force enable func1
          sed -i 's/if (!p_data->pwrseq) {/if (1) { \/* RK3528 always enable *\//' $SDIOHAL

          # WiFi driver API fixes
          sed -i 's/cfg80211_new_sta(vif->ndev,/cfg80211_new_sta(\&vif->wdev,/g' $DRV/cfg80211.c
          sed -i 's/cfg80211_del_sta(vif->ndev,/cfg80211_del_sta(\&vif->wdev,/g' $DRV/cfg80211.c
          sed -i 's/from_timer(priv, t, scan_timer)/container_of(t, struct sprdwl_priv, scan_timer)/g' $DRV/cfg80211.c
          sed -i 's/from_timer(ack_info, t, timer)/container_of(t, struct sprdwl_tcp_ack_info, timer)/g' $DRV/tcp_ack.c
          sed -i 's/from_timer(ba_node, t, reorder_timer)/container_of(t, struct rx_ba_node, reorder_timer)/g' $DRV/reorder.c
          sed -i 's/\bdel_timer_sync\b/timer_delete_sync/g' $DRV/cfg80211.c
          sed -i 's/\bsetup_timer\b/timer_setup/g' $DRV/cfg80211.c
          sed -i 's/\bdel_timer\b/timer_delete/g' $DRV/tcp_ack.c
          sed -i 's/\bsetup_timer\b/timer_setup/g' $DRV/tcp_ack.c
          sed -i 's/\bdel_timer_sync\b/timer_delete_sync/g' $DRV/reorder.c
          sed -i 's/\bdel_timer\b/timer_delete/g' $DRV/reorder.c
          sed -i '703s/from_timer(priv, t, wmmac.wmmac_edcaf_timer)/container_of(t, struct sprdwl_priv, wmmac.wmmac_edcaf_timer)/' $DRV/qos.c
          sed -i 's/\bdel_timer_sync\b/timer_delete_sync/g' $DRV/qos.c
          sed -i 's/\bsetup_timer\b/timer_setup/g' $DRV/qos.c
          sed -i 's/\bdel_timer\b/timer_delete/g' $DRV/qos.c

          echo 'ccflags-y += -DCONFIG_RK_BOARD' >> $WCN/sdio/Makefile
          find $DRV $WCN -name "*.c" -exec sed -i '/^MODULE_IMPORT_NS/d' {} \;
          for d in $DRV $WCN/sdio $WCN/platform; do
            echo 'subdir-ccflags-y := -Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types' >> "$d/Makefile" 2>/dev/null || true
          done

          echo "=== Verification ==="
          echo "--- DIAG in sdiohal_main ---"
          grep -n 'DIAG_FW.*dt_write' $SDIOHAL | head -10
          echo "--- DIAG in wcn_boot ---"
          grep -n 'DIAG_FW' $WCNBOOT | head -10
          echo "--- ISR guard ---"
          grep -n -A2 'disable_irq_nosync' $SDIO_INT | head -6
          echo "--- pwrseq/force enable ---"
          grep -n 'RK3528\|Always enable' $SDIOHAL | head -5

      - name: Prepare kernel config and compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i 's/obj-.*clk-imx8mp-audiomix.o/#&/' drivers/clk/imx/Makefile
          sed -i 's/obj-.*clk-vbattb.o/#&/' drivers/clk/renesas/Makefile
          make defconfig
          scripts/config --disable CONFIG_DRM_SUN4I
          make -j$(nproc) Image dtbs modules 2>&1 | grep -E 'error:|Error:|undefined|implicit|No such|make\[.*\]:' || true
          ls -la arch/arm64/boot/Image || { echo "Image build FAILED"; exit 1; }
          ls -la arch/arm64/boot/dts/rockchip/rk3528-w132d.dtb || { echo "DTB build FAILED"; exit 1; }

      - name: Install full module tree
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p modinstall
          make INSTALL_MOD_PATH=./modinstall modules_install
          find modinstall -type l -name build -delete
          find modinstall -type l -name source -delete
          find modinstall -name "sprdwl_ng.ko" -ls || true

      - name: Package and verify output
        run: |
          mkdir -p output
          cp -v arch/arm64/boot/Image output/Image
          cp -v arch/arm64/boot/dts/rockchip/rk3528-w132d.dtb output/rk3528-w132d.dtb
          cp -r modinstall/lib output/
          cd output && zip -r ../rk3528-w132d-kernel.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3528-w132d-kernel
          path: rk3528-w132d-kernel.zip
