name: Compile SY910 Kernel + WiFi Modules for 6.18

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Linux 6.18.y kernel
        uses: actions/checkout@v4
        with:
          repository: RBCSFQ/linux-6.18.y
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc python3

      - name: Fix DTS includes and register in Makefile
        run: |
          DTS_DIR=arch/arm64/boot/dts/rockchip
          DTS=$DTS_DIR/rk3528-sy910.dts
          echo "=== DTS first 10 lines (BEFORE fix) ==="
          head -10 $DTS || { echo "FATAL: DTS does not exist in repo"; exit 1; }
          # Remove include of non-existent ddr4-lp3-v11 dtsi
          if grep -q 'rk3528-ddr4-lp3-v11' $DTS; then
            echo "Removing: rk3528-ddr4-lp3-v11.dtsi include"
            sed -i '/rk3528-ddr4-lp3-v11/d' $DTS
          fi
          echo "=== DTS first 10 lines (AFTER fix) ==="
          head -10 $DTS
          # Register DTS in Makefile if not already present
          if ! grep -q 'rk3528-sy910.dtb' $DTS_DIR/Makefile; then
            echo "Adding rk3528-sy910.dtb to Makefile"
            sed -i '/^dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3528-evb1-ddr4-v10.dtb/a dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3528-sy910.dtb' $DTS_DIR/Makefile
          fi
          echo "=== Makefile registration ==="
          grep 'rk3528-sy910' $DTS_DIR/Makefile || echo "WARNING: Not registered"

      - name: Patch unisoc WiFi drivers for 6.18 API
        run: |
          DRV=drivers/net/wireless/unisoc/unisocwifi
          WCN=drivers/net/wireless/unisoc/unisocwcn
          SDIOHAL=$WCN/sdio/sdiohal_main.c
          SDIO_INT=$WCN/sleep/sdio_int.c
          # Interrupt storm guard
          sed -i '/disable_irq_nosync(irq);/a\        if (!atomic_read(\&sdiohal_get_data()->xmit_start)) { return IRQ_HANDLED; }' $SDIO_INT
          # Downgrade noisy logs to debug
          sed -i 's/sdiohal_info("%s wait xmit_cnt:%d/sdiohal_debug("%s wait xmit_cnt:%d/' $SDIOHAL
          sed -i 's/sdiohal_info("%s wait xmit_cnt end/sdiohal_debug("%s wait xmit_cnt end/' $SDIOHAL
          # Force SDIO func enable on RK3528
          sed -i 's/p_data->pwrseq = true;/p_data->pwrseq = false; \/* RK3528 *\//' $SDIOHAL
          sed -i 's/if (!p_data->pwrseq) {/if (1) { \/* RK3528 always enable *\//' $SDIOHAL
          # cfg80211 API fixes
          sed -i 's/cfg80211_new_sta(vif->ndev,/cfg80211_new_sta(\&vif->wdev,/g' $DRV/cfg80211.c 2>/dev/null || true
          sed -i 's/cfg80211_del_sta(vif->ndev,/cfg80211_del_sta(\&vif->wdev,/g' $DRV/cfg80211.c 2>/dev/null || true
          # from_timer -> container_of
          sed -i 's/from_timer(priv, t, scan_timer)/container_of(t, struct sprdwl_priv, scan_timer)/g' $DRV/cfg80211.c 2>/dev/null || true
          sed -i 's/from_timer(ack_info, t, timer)/container_of(t, struct sprdwl_tcp_ack_info, timer)/g' $DRV/tcp_ack.c 2>/dev/null || true
          sed -i 's/from_timer(ba_node, t, reorder_timer)/container_of(t, struct rx_ba_node, reorder_timer)/g' $DRV/reorder.c 2>/dev/null || true
          # Timer API (del_timer -> timer_delete etc)
          for f in $DRV/cfg80211.c $DRV/tcp_ack.c $DRV/reorder.c $DRV/qos.c; do
            sed -i 's/\bdel_timer_sync\b/timer_delete_sync/g' "$f" 2>/dev/null || true
            sed -i 's/\bsetup_timer\b/timer_setup/g' "$f" 2>/dev/null || true
            sed -i 's/\bdel_timer\b/timer_delete/g' "$f" 2>/dev/null || true
          done
          # qos.c: from_timer with nested struct
          sed -i '703s/from_timer(priv, t, wmmac.wmmac_edcaf_timer)/container_of(t, struct sprdwl_priv, wmmac.wmmac_edcaf_timer)/' $DRV/qos.c 2>/dev/null || true
          # Add CONFIG_RK_BOARD flag and warning suppressions
          echo 'ccflags-y += -DCONFIG_RK_BOARD' >> $WCN/sdio/Makefile
          for d in $DRV $WCN $WCN/sdio $WCN/platform $WCN/sleep; do
            if [ -f "$d/Makefile" ]; then
              echo 'subdir-ccflags-y := -Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types' >> "$d/Makefile" 2>/dev/null || true
            fi
          done
          find $DRV $WCN -name "*.c" -exec sed -i '/^MODULE_IMPORT_NS/d' {} \; 2>/dev/null || true
          echo "=== Unisoc patches applied ==="

      - name: Prepare kernel config and compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Work around broken clk drivers
          sed -i 's/obj-.*clk-imx8mp-audiomix.o/#&/' drivers/clk/imx/Makefile 2>/dev/null || true
          sed -i 's/obj-.*clk-vbattb.o/#&/' drivers/clk/renesas/Makefile 2>/dev/null || true

          make defconfig
          scripts/config --enable CONFIG_SPARD_WLAN_SUPPORT
          scripts/config --enable CONFIG_RK_WIFI_DEVICE_UWE5621
          scripts/config --enable CONFIG_SPRDWL_NG
          scripts/config --enable CONFIG_WCN_BOOT
          scripts/config --disable CONFIG_DRM_SUN4I
          scripts/config --disable CONFIG_WERROR
          make -j$(nproc) olddefconfig 2>&1 | tail -3

          echo "=== Config check ==="
          grep -E 'SPARD_WLAN|RK_WIFI|SPRDWL|WCN_BOOT|WERROR' .config

          # ====== Build DTB first (fail early) ======
          echo "=== Build dtbs (full output, unfiltered) ==="
          make -j$(nproc) dtbs 2>&1 | tail -40
          DTBS_EXIT=$?
          echo "dtbs exit code: $DTBS_EXIT"
          if ls -la arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb 2>/dev/null; then
            echo "SY910 DTB: OK"
          else
            echo "SY910 DTB: MISSING"
            # Show Makefile to confirm registration
            grep 'rk3528-sy910' arch/arm64/boot/dts/rockchip/Makefile
            # Show all possible DTB files produced
            echo "=== DTB files produced ==="
            find arch/arm64/boot/dts -name "*.dtb" | sort
            exit 1
          fi

          # ====== Build modules ======
          echo "=== Build modules ==="
          make -j$(nproc) modules 2>&1 | tail -10
          echo "modules exit: $?"

          echo "=== Unisoc .ko files ==="
          find drivers/net/wireless/unisoc -name "*.ko" -ls 2>/dev/null || echo "None"

          # ====== Build Image ======
          echo "=== Build Image ==="
          make -j$(nproc) Image 2>&1 | tail -5
          echo "Image exit: $?"
          ls -la arch/arm64/boot/Image || { echo "FATAL: Image MISSING"; exit 1; }
          echo "Image: OK"

      - name: Package output
        run: |
          rm -rf output
          mkdir -p output/modules
          # Copy ALL unisoc .ko files preserving dir structure
          find . -name "*.ko" -path "*/unisoc/*" 2>/dev/null | while read f; do
            dir="$(dirname "$f")"
            mkdir -p "output/modules/$dir"
            cp "$f" "output/modules/$dir/"
          done
          echo "=== Module count: $(find output/modules -name '*.ko' 2>/dev/null | wc -l) ==="
          find output/modules -name "*.ko" -ls 2>/dev/null

          cp arch/arm64/boot/Image output/ && echo "Image packaged" || echo "Image MISSING"
          cp arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb output/ && echo "DTB packaged" || echo "DTB MISSING"

          echo "=== Final output ==="
          ls -laR output/

          cd output && zip -r ../rk3528-sy910-kernel.zip . 2>/dev/null || true
          echo "Package created: $(ls -la ../rk3528-sy910-kernel.zip)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3528-sy910-kernel
          path: rk3528-sy910-kernel.zip
