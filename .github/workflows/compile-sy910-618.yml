name: Compile SY910 WIFI Modules for 6.18 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Linux 6.18.y kernel
        uses: actions/checkout@v4
        with:
          repository: RBCSFQ/linux-6.18.y
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc python3

      - name: Register SY910 DTS in Makefile
        run: |
          DTSMK=arch/arm64/boot/dts/rockchip/Makefile
          if ! grep -q 'rk3528-sy910.dtb' $DTSMK; then
            echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3528-sy910.dtb' >> $DTSMK
            echo "SY910 DTS registered in Makefile"
          else
            echo "SY910 DTS already registered"
          fi

      - name: Patch unisoc drivers
        run: |
          DRV=drivers/net/wireless/unisoc/unisocwifi
          WCN=drivers/net/wireless/unisoc/unisocwcn
          SDIOHAL=$WCN/sdio/sdiohal_main.c
          SDIO_INT=$WCN/sleep/sdio_int.c

          echo "=== Step 1: ISR guard ==="
          sed -i '/disable_irq_nosync(irq);/a\        if (!atomic_read(\&sdiohal_get_data()->xmit_start)) { return IRQ_HANDLED; }' $SDIO_INT

          echo "=== Step 2: Suppress log spam ==="
          sed -i 's/sdiohal_info("%s wait xmit_cnt:%d/sdiohal_debug("%s wait xmit_cnt:%d/' $SDIOHAL
          sed -i 's/sdiohal_info("%s wait xmit_cnt end/sdiohal_debug("%s wait xmit_cnt end/' $SDIOHAL

          echo "=== Step 3: Force pwrseq off for RK3528 ==="
          sed -i 's/p_data->pwrseq = true;/p_data->pwrseq = false; \/* RK3528 always enable *\//' $SDIOHAL
          sed -i 's/if (!p_data->pwrseq) {/if (1) { \/* RK3528 always enable *\//' $SDIOHAL

          echo "=== Step 4: API compat fixes ==="
          sed -i 's/cfg80211_new_sta(vif->ndev,/cfg80211_new_sta(\&vif->wdev,/g' $DRV/cfg80211.c 2>/dev/null || true
          sed -i 's/cfg80211_del_sta(vif->ndev,/cfg80211_del_sta(\&vif->wdev,/g' $DRV/cfg80211.c 2>/dev/null || true
          sed -i 's/from_timer(priv, t, scan_timer)/container_of(t, struct sprdwl_priv, scan_timer)/g' $DRV/cfg80211.c 2>/dev/null || true
          sed -i 's/from_timer(ack_info, t, timer)/container_of(t, struct sprdwl_tcp_ack_info, timer)/g' $DRV/tcp_ack.c 2>/dev/null || true
          sed -i 's/from_timer(ba_node, t, reorder_timer)/container_of(t, struct rx_ba_node, reorder_timer)/g' $DRV/reorder.c 2>/dev/null || true

          for f in $DRV/cfg80211.c $DRV/tcp_ack.c $DRV/reorder.c $DRV/qos.c; do
            sed -i 's/\bdel_timer_sync\b/timer_delete_sync/g' "$f" 2>/dev/null || true
            sed -i 's/\bsetup_timer\b/timer_setup/g' "$f" 2>/dev/null || true
            sed -i 's/\bdel_timer\b/timer_delete/g' "$f" 2>/dev/null || true
          done
          sed -i '703s/from_timer(priv, t, wmmac.wmmac_edcaf_timer)/container_of(t, struct sprdwl_priv, wmmac.wmmac_edcaf_timer)/' $DRV/qos.c 2>/dev/null || true

          echo "=== Step 5: RK_BOARD flag ==="
          echo 'ccflags-y += -DCONFIG_RK_BOARD' >> $WCN/sdio/Makefile

          echo "=== Step 6: Warnings suppression ==="
          for d in $DRV $WCN $WCN/sdio $WCN/platform $WCN/sleep; do
            if [ -f "$d/Makefile" ]; then
              echo 'subdir-ccflags-y := -Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types' >> "$d/Makefile" 2>/dev/null || true
            fi
          done

          echo "=== Step 7: Remove MODULE_IMPORT_NS ==="
          find $DRV $WCN -name "*.c" -exec sed -i '/^MODULE_IMPORT_NS/d' {} \; 2>/dev/null || true

          echo "=== Patches applied ==="

      - name: Prepare kernel config and compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== Fix clk build issues ==="
          sed -i 's/obj-.*clk-imx8mp-audiomix.o/#&/' drivers/clk/imx/Makefile 2>/dev/null || true
          sed -i 's/obj-.*clk-vbattb.o/#&/' drivers/clk/renesas/Makefile 2>/dev/null || true

          echo "=== Generate config ==="
          make defconfig
          scripts/config --enable CONFIG_SPARD_WLAN_SUPPORT
          scripts/config --enable CONFIG_RK_WIFI_DEVICE_UWE5621
          scripts/config --enable CONFIG_SPRDWL_NG
          scripts/config --enable CONFIG_WCN_BOOT
          scripts/config --disable CONFIG_DRM_SUN4I
          scripts/config --disable CONFIG_WERROR
          make -j$(nproc) olddefconfig 2>&1 | tail -3
          make -j$(nproc) modules_prepare 2>&1 | tail -5

          echo "=== Config check ==="
          grep -E 'SPARD_WLAN|RK_WIFI|SPRDWL|WCN_BOOT|LOCALVERSION|WERROR' .config

          echo "=== Building Image + dtbs + modules ==="
          make -j$(nproc) Image dtbs modules 2>&1 | tail -30

          echo "=== Checking outputs ==="
          ls -la arch/arm64/boot/Image
          ls -la arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb

          echo "=== Built modules ==="
          find drivers/net/wireless/unisoc -name "*.ko" -ls
          find . -name "*.ko" -path "*/unisoc/*" -ls

      - name: Package output
        run: |
          mkdir -p output/modules
          find . -name "*.ko" -path "*/unisoc/*" | while read f; do
            dir="$(dirname "$f")"
            mkdir -p "output/modules/$dir"
            cp "$f" "output/modules/$dir/"
          done
          echo "=== Module count: $(find output/modules -name '*.ko' | wc -l) ==="
          find output/modules -name "*.ko" -ls

          cp arch/arm64/boot/Image output/ 2>/dev/null || true
          cp arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb output/ 2>/dev/null || true

          cd output && zip -r ../rk3528-sy910-kernel.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3528-sy910-kernel
          path: rk3528-sy910-kernel.zip
