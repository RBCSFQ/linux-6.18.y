name: Build W132D Eth0 Motorcomm with fnOS Symbols
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cross-compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev make python3

      - name: Use fnOS exact config and symbols
        run: |
          # 使用 fnOS 原始配置，避免无关驱动编译失败
          cp w132d_fnos.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # 注入 fnOS 的 Module.symvers，解决 undefined symbol
          cp w132d_fnos-Module.symvers Module.symvers
          
          # 仅准备头文件和构建脚本，不编译任何 .c 文件
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare modules_prepare

      - name: Verify critical symbols
        run: |
          grep "phy_drivers_register" Module.symvers || (echo "FATAL: Missing PHY symbols" && exit 1)

      - name: Build ONLY motorcomm.ko
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/net/phy modules
          ls -la drivers/net/phy/motorcomm.ko

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motorcomm-ko-nas-matched
          path: drivers/net/phy/motorcomm.ko
