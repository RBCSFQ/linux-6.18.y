name: Build W132D Eth0 Motorcomm PHY Module (Fixed)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cross-compiler and deps
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev make python3

      - name: Configure kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/config -e CONFIG_MOTORCOMM_PHY
          ./scripts/config -e CONFIG_STMMAC_ETH
          ./scripts/config -e CONFIG_DWMAC_ROCKCHIP
          ./scripts/config -e CONFIG_OF_MDIO
          ./scripts/config -d CONFIG_STACKPROTECTOR_STRONG
          ./scripts/config -e CONFIG_STACKPROTECTOR
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Full kernel prepare + build vmlinux & core modules
        run: |
          # 关键：必须先完整编译 vmlinux 和所有依赖模块，生成 Module.symvers
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux modules
          
      - name: Verify Module.symvers exists
        run: |
          ls -la Module.symvers
          grep -c "phy_drivers_register" Module.symvers || echo "WARNING: phylib symbols not found"

      - name: Build only motorcomm.ko (with full symbol table)
        run: |
          # 此时 Module.symvers 已包含所有 PHY 子系统符号
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/net/phy modules
          ls -la drivers/net/phy/motorcomm.ko

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: motorcomm-ko-6.18
          path: drivers/net/phy/motorcomm.ko
