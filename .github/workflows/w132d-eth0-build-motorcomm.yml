name: Build W132D eth0 Motorcomm with fnOS Symbols
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cross-compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev make python3

      - name: Configure with forced Motorcomm (post-olddefconfig override)
        run: |
          cp w132d_fnos.config .config
          
          # 第一轮：先让 olddefconfig 处理基础依赖
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # ⭐ 关键修复：在 olddefconfig 之后再强制写入
          # 这样即使依赖缺失，也会以 =m 形式保留在 .config 中
          ./scripts/config -e CONFIG_MOTORCOMM_PHY
          ./scripts/config -e CONFIG_PHYLIB
          ./scripts/config -e CONFIG_OF_MDIO
          ./scripts/config -e CONFIG_FIXED_PHY
          
          # 第二轮 olddefconfig 仅用于展开新选项的子依赖，不会删除已存在的 =m
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # 注入 fnOS 符号表
          cp w132d_fnos-Module.symvers Module.symvers
          
          # 准备构建环境
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare modules_prepare

      - name: Debug - verify motorcomm in final .config
        run: |
          echo "=== MOTORCOMM related config entries ==="
          grep -i "MOTORCOMM\|PHYLIB\|OF_MDIO\|FIXED_PHY" .config || true
          echo "========================================="
          if ! grep -qE "^CONFIG_MOTORCOMM_PHY=[ym]" .config; then
            echo "FATAL: CONFIG_MOTORCOMM_PHY is NOT set in final .config"
            exit 1
          fi
          echo "✅ CONFIG_MOTORCOMM_PHY is enabled"

      - name: Build ONLY motorcomm.ko
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/net/phy modules
          ls -la drivers/net/phy/motorcomm.ko

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motorcomm-ko-fnOS-matched
          path: drivers/net/phy/motorcomm.ko
