name: Compile W132D WiFi Module for 6.18.18.c963-trim (v3 - fixed commit)

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source (commit with unisoc driver)
        uses: actions/checkout@v4
        with:
          repository: RBCSFQ/linux-6.18.y
          ref: 867a7954d321d2b0e9707cfd8a4b9e20e3e24f28

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12-aarch64-linux-gnu flex bison bc dwarves pahole libelf-dev device-tree-compiler
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ar aarch64-linux-gnu-gcc-ar /usr/bin/aarch64-linux-gnu-gcc-ar-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-nm aarch64-linux-gnu-gcc-nm /usr/bin/aarch64-linux-gnu-gcc-nm-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ranlib aarch64-linux-gnu-gcc-ranlib /usr/bin/aarch64-linux-gnu-gcc-ranlib-12 100
          aarch64-linux-gnu-gcc --version

      - name: Configure kernel for c963-trim + WiFi
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 18/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = .c963-trim/" Makefile
          head -5 Makefile
          export LOCALVERSION=""

          KCONFIG_FILE=drivers/net/wireless/unisoc/Kconfig
          sed -i "/select RK_WIFI_DEVICE_UWE5621/d" $KCONFIG_FILE 2>/dev/null || true
          WCN_KCONFIG=drivers/net/wireless/unisoc/unisocwcn/Kconfig
          sed -i "s/bool \"Rockchip UWE5621 BSP Support\"/tristate \"Rockchip UWE5621 BSP Support\"/" $WCN_KCONFIG 2>/dev/null || true

          make ARCH=arm64 defconfig 2>&1 | tail -5
          echo "CONFIG_SPARD_WLAN_SUPPORT=y" >> .config
          echo "CONFIG_SPRDWL_NG=m" >> .config
          echo "CONFIG_WCN_BOOT=y" >> .config
          echo "CONFIG_RK_WIFI_DEVICE_UWE5621=m" >> .config
          echo "CONFIG_CFG80211=m" >> .config
          make olddefconfig 2>&1 | tail -5
          grep -E "LOCALVERSION|SPARD|SPRDWL|WCN|UWE5621" .config

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          make -j$(nproc) 2>&1 | tail -15
          ls -la vmlinux

      - name: Build unisoc WiFi modules
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          UNISOC=drivers/net/wireless/unisoc

          echo "=== unisocwcn ==="
          make M=$UNISOC/unisocwcn modules KBUILD_MODPOST_WARN=1 2>&1 | tail -40

          echo "=== unisocwifi ==="
          make M=$UNISOC/unisocwifi modules KBUILD_MODPOST_WARN=1 2>&1 | tail -40

          KO_COUNT=$(find $UNISOC -name "*.ko" 2>/dev/null | wc -l)
          echo "Module count: $KO_COUNT"
          find $UNISOC -name "*.ko" -exec ls -lh {} \;

          [ "$KO_COUNT" -eq 0 ] && { echo "FATAL: No modules built"; exit 1; }

          find $UNISOC -name "*.ko" | while read ko; do
            echo "--- $(basename $ko) ---"
            aarch64-linux-gnu-objcopy --remove-section=.BTF "$ko" 2>/dev/null || true
            modinfo "$ko" | grep -E "vermagic|depends|filename"
          done

      - name: Package modules
        run: |
          rm -rf output
          mkdir -p output
          find drivers/net/wireless/unisoc -name "*.ko" | while read ko; do
            cp "$ko" output/
          done
          echo "Packaged: $(ls output/)"
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: w132d-c963-wifi-modules
          path: output/
