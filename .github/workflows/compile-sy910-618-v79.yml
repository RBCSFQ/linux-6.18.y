name: Compile SY910 WiFi Module v79 (UWE5621DS)

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: RBCSFQ/linux-6.18.y
          ref: main
          fetch-depth: 0

      - name: Install dependencies (GCC 12)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12-aarch64-linux-gnu flex bison bc dwarves pahole libelf-dev device-tree-compiler
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ar aarch64-linux-gnu-gcc-ar /usr/bin/aarch64-linux-gnu-gcc-ar-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-nm aarch64-linux-gnu-gcc-nm /usr/bin/aarch64-linux-gnu-gcc-nm-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ranlib aarch64-linux-gnu-gcc-ranlib /usr/bin/aarch64-linux-gnu-gcc-ranlib-12 100
          aarch64-linux-gnu-gcc --version

      - name: "STEP 0: Inspect source"
        run: |
          echo "=============================================="
          echo "=== SOURCE INSPECTION v79 ==="
          echo "=============================================="
          WCN=drivers/net/wireless/unisoc/unisocwcn
          DRV=drivers/net/wireless/unisoc/unisocwifi
          DTS_DIR=arch/arm64/boot/dts/rockchip
          DTS=$DTS_DIR/rk3528-sy910.dts

          echo ""
          echo "=== 1. Driver compatible string ==="
          grep -n "unisoc,uwe" $WCN/platform/wcn_boot.c || echo "NOT FOUND"
          grep -rn "unisoc,uwe" $WCN/ || echo "NOT FOUND in wcn"

          echo ""
          echo "=== 2. Full uwe-bsp@1 DTS node (BEFORE any changes) ==="
          if [ -f "$DTS" ]; then
            grep -n "unisoc,uwe\|uwe.bsp\|uwe-bsp" $DTS
            echo "--- Full node ---"
            sed -n '/uwe.bsp/,/};/p' $DTS | head -30
          else
            echo "ERROR: DTS not found!"
            ls $DTS_DIR/rk3528*.dts 2>/dev/null | head -10
          fi

          echo ""
          echo "=== 3. wl-reg-on / WL_DIS_N search in source ==="
          grep -rn "wl.reg\|wl_dis\|WL_DIS\|wl-reg-on" $WCN/ $DRV/ 2>/dev/null | head -20 || echo "Not found"

          echo ""
          echo "=== 4. start_marlin function ==="
          grep -n -A10 "int start_marlin" $WCN/platform/wcn_boot.c | head -25

          echo ""
          echo "=== 5. pinctrl usage in driver source ==="
          grep -rn "pinctrl_select_state\|pinctrl_bind_pins\|devm_pinctrl" $WCN/ $DRV/ 2>/dev/null | head -20

          echo ""
          echo "=== 6. Kernel config ==="
          ls -la .github/config-6.18.18.c951-trim 2>/dev/null

          echo ""
          echo "=== 7. Makefile head ==="
          head -5 Makefile

          echo ""
          echo "=== 8. of_platform.h ==="
          ls include/linux/of_platform.h 2>/dev/null && echo "EXISTS" || echo "NOT FOUND"
          grep -c "of_platform_device_create" include/linux/of_platform.h 2>/dev/null || echo "0"

          echo ""
          echo "=== 9. pub-int-gpio in source ==="
          grep -rn "pub-int-gpio" $WCN/ $DRV/ 2>/dev/null || echo "Not found"

          echo ""
          echo "=== 10. Search for manual GPIO control (power on/off) ==="
          grep -rn "gpio_request\|gpio_free\|gpio_set_value\|gpio_direction" $WCN/platform/ 2>/dev/null | head -20

          echo ""
          echo "=============================================="
          echo "=== END INSPECTION ==="
          echo "=============================================="

      - name: "STEP 1: Fix DTS compatible + cleanups (NO pinctrl stripping)"
        run: |
          DTS_DIR=arch/arm64/boot/dts/rockchip
          DTS=$DTS_DIR/rk3528-sy910.dts
          WCN=drivers/net/wireless/unisoc/unisocwcn

          DRV_COMPAT=$(grep -oP '"unisoc,uwe[^"]*"' $WCN/platform/wcn_boot.c | head -1 | tr -d '"')
          echo "Driver compatible: '$DRV_COMPAT'"

          if [ -z "$DRV_COMPAT" ]; then
            echo "ERROR: Cannot detect driver compatible string!"
            exit 1
          fi

          DTS_COMPAT=$(grep -oP '"unisoc,uwe[^"]*"' $DTS | head -1 | tr -d '"')
          echo "DTS compatible: '$DTS_COMPAT'"

          if [ "$DRV_COMPAT" != "$DTS_COMPAT" ]; then
            echo "MISMATCH! Fixing DTS: '$DTS_COMPAT' -> '$DRV_COMPAT'"
            sed -i "s/\"unisoc,uwe[^\"]*\"/\"$DRV_COMPAT\"/" $DTS
          else
            echo "MATCH OK"
          fi
          grep -n "unisoc,uwe" $DTS

          # DTS cleanups (same as v54)
          sed -i "/rk3528-ddr4-lp3-v11/d" $DTS
          for LABEL in cpu0 gpu display_subsystem vop vop_mmu hdmi hdmi_in_vop usb2phy usbdrd30 usbdrd_dwc3 pcie2x1 rng sfc; do
            sed -i "/^&$LABEL {/,/^};$/d" $DTS
          done
          sed -i "/drm-logo@0 {/,/};$/d" $DTS
          sed -i "/drm-cubic-lut@0 {/,/};$/d" $DTS
          sed -i "s/clocks = <&xin24m>;//g" $DTS
          sed -i "s/pcfg_pull_none_schmitt/pcfg_pull_none/g" $DTS
          sed -i "/^[\t ]*reserved-memory {$/,/^[\t ]*};$/d" $DTS

          # v79: KEEP pinctrl + pub-int-gpio in DTB (like v54)
          # Rationale: v54 proved that pinctrl intact -> system alive.
          # Stripping pinctrl (v75+) causes crash on sprdwl_ng modprobe.
          echo "=== v79: DTB KEEPS pinctrl (WL_HOST_WAKE IRQ needed for chip power-on) ==="
          echo "=== After cleanups (uwe-bsp@1 kept intact) ==="
          sed -n '/uwe.bsp/,/};/p' $DTS

          # Ensure DTB in Makefile
          if ! grep -q "rk3528-sy910.dtb" $DTS_DIR/Makefile; then
            sed -i "/^dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3528-evb1-ddr4-v10.dtb/a dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3528-sy910.dtb" $DTS_DIR/Makefile
          fi
          echo "DTS step complete"

      - name: "STEP 2: Patch unisoc drivers (API adaptation + pinctrl tolerance)"
        run: |
          DRV=drivers/net/wireless/unisoc/unisocwifi
          WCN=drivers/net/wireless/unisoc/unisocwcn
          SDIOHAL=$WCN/sdio/sdiohal_main.c

          echo "=== Applying API adaptation patches ==="

          # sched_setscheduler -> sched_set_fifo
          if grep -q "sched_setscheduler" $WCN/sdio/sdiohal_tx.c 2>/dev/null; then
            sed -i "/struct sched_param param;/d" $WCN/sdio/sdiohal_tx.c
            sed -i "/param\.sched_priority = SDIO_TX_TASK_PRIO;/d" $WCN/sdio/sdiohal_tx.c
            sed -i "s#sched_setscheduler(current, SCHED_FIFO, &param);#sched_set_fifo(current);#" $WCN/sdio/sdiohal_tx.c
            echo "  tx: sched patched"
          fi
          if grep -q "sched_setscheduler" $WCN/sdio/sdiohal_rx.c 2>/dev/null; then
            sed -i "/struct sched_param param;/d" $WCN/sdio/sdiohal_rx.c
            sed -i "/param\.sched_priority = SDIO_RX_TASK_PRIO;/d" $WCN/sdio/sdiohal_rx.c
            sed -i "s#sched_setscheduler(current, SCHED_FIFO, &param);#sched_set_fifo(current);#" $WCN/sdio/sdiohal_rx.c
            echo "  rx: sched patched"
          fi

          sed -i "s/disable_irq_nosync(irq);/disable_irq(irq);/" $WCN/sleep/sdio_int.c 2>/dev/null || true
          sed -i "s/sdiohal_info(\"%s wait xmit_cnt:%d/sdiohal_debug(\"%s wait xmit_cnt:%d/" $SDIOHAL 2>/dev/null || true
          sed -i "s/sdiohal_info(\"%s wait xmit_cnt end/sdiohal_debug(\"%s wait xmit_cnt end/" $SDIOHAL 2>/dev/null || true

          # pwrseq: RK3528 MMC core handles pwrseq
          if grep -q "p_data->pwrseq = true;" $SDIOHAL 2>/dev/null; then
            sed -i "s#p_data->pwrseq = true;#p_data->pwrseq = false; /* RK3528: MMC core handles pwrseq */#" $SDIOHAL
            echo "  pwrseq=true patched"
          fi
          if grep -q "if (!p_data->pwrseq) {" $SDIOHAL 2>/dev/null; then
            sed -i "s#if (!p_data->pwrseq) {#if (1) { /* RK3528 always enable */#" $SDIOHAL
            echo "  pwrseq check patched"
          fi

          # cfg80211 API
          sed -i "s/cfg80211_new_sta(vif->ndev,/cfg80211_new_sta(\&vif->wdev,/g" $DRV/cfg80211.c 2>/dev/null || true
          sed -i "s/cfg80211_del_sta(vif->ndev,/cfg80211_del_sta(\&vif->wdev,/g" $DRV/cfg80211.c 2>/dev/null || true

          # Timer API
          sed -i "s/from_timer(priv, t, scan_timer)/container_of(t, struct sprdwl_priv, scan_timer)/g" $DRV/cfg80211.c 2>/dev/null || true
          sed -i "s/from_timer(ack_info, t, timer)/container_of(t, struct sprdwl_tcp_ack_info, timer)/g" $DRV/tcp_ack.c 2>/dev/null || true
          sed -i "s/from_timer(ba_node, t, reorder_timer)/container_of(t, struct rx_ba_node, reorder_timer)/g" $DRV/reorder.c 2>/dev/null || true
          sed -i "s/from_timer(priv, t, wmmac\.wmmac_edcaf_timer)/container_of(t, struct sprdwl_priv, wmmac.wmmac_edcaf_timer)/g" $DRV/qos.c 2>/dev/null || true
          for f in $DRV/cfg80211.c $DRV/tcp_ack.c $DRV/reorder.c $DRV/qos.c; do
            sed -i "s/\bdel_timer_sync\b/timer_delete_sync/g" "$f" 2>/dev/null || true
            sed -i "s/\bsetup_timer\b/timer_setup/g" "$f" 2>/dev/null || true
            sed -i "s/\bdel_timer\b/timer_delete/g" "$f" 2>/dev/null || true
          done

          # MODULE_IMPORT_NS
          find $DRV $WCN -name "*.c" -exec sed -i "/^MODULE_IMPORT_NS/d" {} \; 2>/dev/null || true

          # sdiohal host lookup fallback
          sed -i '/sdio_node = of_parse_phandle(np, "sdhci-name", 0);/a\
          \tif (!sdio_node) sdio_node = of_get_parent(np);' $SDIOHAL
          grep -q "of_get_parent" $SDIOHAL && echo "sdiohal fallback OK" || { echo "sdiohal fallback FAIL"; exit 1; }

          # === of_find_device_by_node compat + pinctrl tolerance ===
          python3 << 'V79EOF'
          import re, os

          fpath = "drivers/net/wireless/unisoc/unisocwcn/sdio/sdiohal_main.c"
          with open(fpath, "r") as f:
              content = f.read()
          changes = []

          # 1. of_find_device_by_node compat
          last_include = content.rfind("#include")
          end_of_include = content.find("\n", last_include) + 1
          compat = """
          /* v79: kernel 6.18 compat - of_find_device_by_node removed in kernel 6.8 */
          #ifdef of_find_device_by_node
          #undef of_find_device_by_node
          #endif
          struct platform_device *of_find_device_by_node(struct device_node *np)
          {
              struct device *dev = bus_find_device_by_of_node(&platform_bus_type, np);
              return dev ? container_of(dev, struct platform_device, dev) : NULL;
          }
          EXPORT_SYMBOL(of_find_device_by_node);
          """
          content = content[:end_of_include] + compat + content[end_of_include:]
          changes.append("of_find_device_by_node compat installed")

          # 2. NULL guard for sdiohal_misc_deinit
          m = re.search(r'(int sdiohal_misc_deinit\s*\([^)]*\)\s*[{])', content)
          if m:
              guard = '\n\t/* v79: prevent crash when host lookup failed */\n\tif (!p_data || !p_data->sdio_pdev)\n\t\treturn 0;'
              content = content[:m.end()] + guard + content[m.end():]
              changes.append("NULL guard in sdiohal_misc_deinit")

          # 3. Make pinctrl_select_state errors non-fatal (v54 approach)
          ptn = r'(ret\s*=\s*pinctrl_select_state\([^;]+;)\s*\n(\s*)(if\s*\(ret\)\s*\{)'
          m = re.search(ptn, content)
          if m:
              indent = m.group(2)
              new_block = (m.group(1) + '\n' + indent +
                  'ret = 0; /* v79: pinctrl conflict non-fatal (gpio3-11 shared) */\n' + indent +
                  m.group(3))
              content = content.replace(m.group(0), new_block)
              changes.append("pinctrl_select_state made non-fatal")

          # Also make pinctrl_pm_select_default_state non-fatal
          ptn2 = r'(ret\s*=\s*pinctrl_pm_select_default_state\([^;]+;)\s*\n(\s*)(if\s*\(ret\)\s*\{)'
          m2 = re.search(ptn2, content)
          if m2:
              indent2 = m2.group(2)
              new_block2 = (m2.group(1) + '\n' + indent2 +
                  'ret = 0; /* v79: pm pinctrl non-fatal */\n' + indent2 +
                  m2.group(3))
              content = content.replace(m2.group(0), new_block2)
              changes.append("pinctrl_pm_select made non-fatal")

          # 4. Make sdio dev get platform device non-fatal
          if 'sdiohal_err("sdio dev get platform device failed!!!' in content:
              content = content.replace(
                  'sdiohal_err("sdio dev get platform device failed!!!\\n");',
                  'sdiohal_err("sdio dev get platform device failed (v79 non-fatal)\\n");')
              changes.append("host lookup failure made non-fatal")

          with open(fpath, "w") as f:
              f.write(content)

          print("\n=== v79 sdiohal changes ===")
          for c in changes:
              print(f"  {c}")
          print(f"Total: {len(changes)} changes")
          V79EOF

          echo "=== sdiohal verification ==="
          grep -c "of_find_device_by_node" $SDIOHAL && echo "compat: OK"
          grep -c "pinctrl conflict non-fatal" $SDIOHAL && echo "pinctrl non-fatal: OK"
          grep -c "v79" $SDIOHAL && echo "v79 markers: OK"

          # Build flags
          echo "subdir-ccflags-y := -w -Wno-implicit-function-declaration -Wno-incompatible-pointer-types" >> $WCN/sdio/Makefile 2>/dev/null || true
          for d in $DRV $WCN $WCN/sdio $WCN/platform $WCN/sleep; do
            if [ -f "$d/Makefile" ]; then
              echo "subdir-ccflags-y := -w -Wno-implicit-function-declaration -Wno-incompatible-pointer-types" >> "$d/Makefile" 2>/dev/null || true
            fi
          done

          echo "=== API patches done ==="

      - name: "STEP 3: Patch wcn_procfs.c - NULL guard"
        run: |
          python3 << 'PYEOF'
          import re
          fpath = "drivers/net/wireless/unisoc/unisocwcn/platform/wcn_procfs.c"
          with open(fpath, "r") as f:
              content = f.read()

          old = "int get_loopcheck_status(void)\n{\n\treturn mdbg_proc->fail_count;\n}"
          new = "int get_loopcheck_status(void)\n{\n\tif (!mdbg_proc) return 0;\n\treturn mdbg_proc->fail_count;\n}"
          if old in content:
              content = content.replace(old, new)
              print("NULL guard added (exact match)")
          else:
              pattern = r'(int get_loopcheck_status\(void\)\s*[{])\s*\n(\s*)(return mdbg_proc->fail_count;)'
              match = re.search(pattern, content)
              if match:
                  indent = match.group(2)
                  replacement = f"{match.group(1)}\n{indent}if (!mdbg_proc) return 0;\n{indent}{match.group(3)}"
                  content = content[:match.start()] + replacement + content[match.end():]
                  print("NULL guard added (regex)")
              else:
                  print("WARNING: pattern not found - already patched?")

          with open(fpath, "w") as f:
              f.write(content)
          print("wcn_procfs.c: done")
          PYEOF

      - name: "STEP 4: Patch wcn_boot.c - comprehensive fixes + v79 diagnostics"
        run: |
          WCN=drivers/net/wireless/unisoc/unisocwcn
          WCN_BOOT=$WCN/platform/wcn_boot.c
          echo "=== Pre-conditions ==="
          grep -n "int marlin_init\|if (!marlin_dev)\|return platform_driver_register" $WCN_BOOT | head -10

          python3 << 'V79BOOT'
          import re, os

          fpath = "drivers/net/wireless/unisoc/unisocwcn/platform/wcn_boot.c"
          with open(fpath, "r") as f:
              content = f.read()
          changes = []

          # 1. Clock tolerance
          for name in ["clk_32k", "parent", "source", "enable"]:
              pattern = re.compile(
                  rf'(\bmarlin_dev->clk_{name}\s*=\s*devm_clk_get\([^)]+\);)'
                  rf'\s*\n(\s*)(if\s*\(IS_ERR\(marlin_dev->clk_{name}\)\)\s*' + '\{)'))
              match = pattern.search(content)
              if match:
                  indent = match.group(2)
                  if name == "clk_32k":
                      replacement = (f"{match.group(1)}\n"
                                    f"{indent}if (IS_ERR(marlin_dev->clk_32k)) {{\n"
                                    f"{indent}\tWCN_INFO(\"32k clock not in DT, using internal\\n\");\n"
                                    f"{indent}\tmarlin_dev->clk_32k = NULL;\n"
                                    f"{indent}}}")
                      content = content[:match.start()] + replacement + content[match.end():]
                      changes.append(f"clk_32k: tolerant")
                  elif name in ("parent", "source"):
                      replacement = (f"{match.group(1)}\n"
                                    f"{indent}if (IS_ERR(marlin_dev->clk_{name})) {{\n"
                                    f"{indent}\tWCN_INFO(\"{name} clock not in DT\\n\");\n"
                                    f"{indent}\tmarlin_dev->clk_{name} = NULL;\n"
                                    f"{indent}}}")
                      content = content[:match.start()] + replacement + content[match.end():]
                      changes.append(f"clk_{name}: tolerant")
                  elif name == "enable":
                      replacement = (f"{match.group(1)}\n"
                                    f"{indent}if (IS_ERR(marlin_dev->clk_enable)) {{\n"
                                    f"{indent}\tWCN_INFO(\"enable clock not in DT\\n\");\n"
                                    f"{indent}\tmarlin_dev->clk_enable = NULL;\n"
                                    f"{indent}}}")
                      content = content[:match.start()] + replacement + content[match.end():]
                      changes.append("clk_enable: tolerant")

          # 2. start_marlin NULL guard
          if "if (!marlin_dev)" not in content:
              patterns_start = [
                  '#else\n\tWCN_INFO("%s [%s]\\n", __func__, strno(subsys));',
              ]
              for pat in patterns_start:
                  if pat in content:
                      content = content.replace(pat, pat.replace('#else\n',
                          '#else\n\tif (!marlin_dev) return -ENODEV;\n'))
                      changes.append("start_marlin: NULL guard added")
                      break

          # 3. marlin_parse_dt: return -1 -> return 0
          parse_start = content.find("marlin_parse_dt")
          if parse_start >= 0:
              brace_start = content.find("{", parse_start)
              if brace_start >= 0:
                  depth = 0
                  pos = brace_start
                  while pos < len(content):
                      if content[pos] == '{':
                          depth += 1
                      elif content[pos] == '}':
                          depth -= 1
                          if depth == 0:
                              break
                      pos += 1
                  func_body = content[brace_start:pos+1]
                  ret_count = func_body.count("return -1")
                  if ret_count > 0:
                      new_body = func_body.replace("return -1", "return 0 /* v79: non-fatal */")
                      content = content[:brace_start] + new_body + content[pos+1:]
                      changes.append(f"marlin_parse_dt: {ret_count} return -1 -> return 0")

          # 4. Platform device creation + v79 diagnostics
          old_marlin_init = content.find("int marlin_init(void)")
          return_line = content.find("return platform_driver_register", old_marlin_init)

          if return_line >= 0:
              line_end = content.find("\n", return_line) + 1

              # v79: Replace return platform_driver_register with full block
              # that registers driver + creates device + logs WL_DIS_N GPIO
              pdev_creation = '''
          \t/* v79: Register driver + create device + log key GPIOs */
          \t{
          \t\tint ret;
          \t\tstruct device_node *wcn_np;
          \t\tstruct platform_device *wcn_pdev;
          \t\tint wl_reg_on_gpio, wl_wake_gpio, bt_reg_on_gpio;

          \t\t/* Log key GPIO pin assignments from DTB */
          \t\twcn_np = of_find_compatible_node(NULL, NULL, "unisoc,uwe-bsp");
          \t\tif (!wcn_np)
          \t\t\twcn_np = of_find_compatible_node(NULL, NULL, "unisoc,uwe_bsp");
          \t\tif (wcn_np) {
          \t\t\twl_reg_on_gpio = of_get_named_gpio(wcn_np, "wl-reg-on", 0);
          \t\t\twl_wake_gpio = of_get_named_gpio(wcn_np, "pub-int-gpio", 0);
          \t\t\tbt_reg_on_gpio = of_get_named_gpio(wcn_np, "bt-reg-on", 0);
          \t\t\tWCN_INFO("v79: GPIO check: wl-reg-on=%d, pub-int-gpio(WL_HOST_WAKE)=%d, bt-reg-on=%d\\n",
          \t\t\t\twl_reg_on_gpio, wl_wake_gpio, bt_reg_on_gpio);
          \t\t\tWCN_INFO("v79: WL_DIS_N check: wl-reg-on GPIO %s present in DT\\n",
          \t\t\t\twl_reg_on_gpio >= 0 ? "IS" : "NOT");
          \t\t}

          \t\tret = platform_driver_register(&marlin_driver);
          \t\tif (ret) {
          \t\t\tWCN_ERR("v79: driver register failed\\n");
          \t\t\treturn ret;
          \t\t}

          \t\t/* Create platform device for uwe-bsp@1 */
          \t\twcn_np = of_find_compatible_node(NULL, NULL, "unisoc,uwe-bsp");
          \t\tif (!wcn_np)
          \t\t\twcn_np = of_find_compatible_node(NULL, NULL, "unisoc,uwe_bsp");
          \t\tif (wcn_np) {
          \t\t\twcn_pdev = of_find_device_by_node(wcn_np);
          \t\t\tif (!wcn_pdev) {
          \t\t\t\tof_node_clear_flag(wcn_np, OF_POPULATED);
          \t\t\t\twcn_pdev = of_platform_device_create(wcn_np, NULL, NULL);
          \t\t\t}
          \t\t\tif (wcn_pdev)
          \t\t\t\tWCN_INFO("v79: device created (pinctrl intact, WL_HOST_WAKE shared)\\n");
          \t\t\telse
          \t\t\t\tWCN_ERR("v79: device creation failed\\n");
          \t\t} else {
          \t\t\tWCN_ERR("v79: uwe-bsp DT node NOT FOUND\\n");
          \t\t}
          \t}
          \treturn 0;
          '''

              content = content[:return_line] + pdev_creation + content[line_end:]
              changes.append("marlin_init: platform device creation + GPIO diagnostics")

          with open(fpath, "w") as f:
              f.write(content)

          print("\n=== v79 wcn_boot.c changes ===")
          for c in changes:
              print(f"  {c}")
          print(f"Total: {len(changes)} changes")
          V79BOOT

          echo ""
          echo "=== Verification ==="
          grep -c "v79:" $WCN_BOOT && echo "v79 markers: OK"
          grep -c "wl-reg-on" $WCN_BOOT && echo "wl-reg-on check: OK"
          grep -n "int marlin_init" $WCN_BOOT | head -3
          echo "=== wcn_boot.c v79 patch complete ==="

      - name: Configure kernel (ophub config)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 18/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = .c951-trim/" Makefile
          head -5 Makefile
          export LOCALVERSION=""
          KCONFIG_FILE=drivers/net/wireless/unisoc/Kconfig
          sed -i "/select RK_WIFI_DEVICE_UWE5621/d" $KCONFIG_FILE
          WCN_KCONFIG=drivers/net/wireless/unisoc/unisocwcn/Kconfig
          sed -i "s/bool \"Rockchip UWE5621 BSP Support\"/tristate \"Rockchip UWE5621 BSP Support\"/" $WCN_KCONFIG
          cp .github/config-6.18.18.c951-trim .config
          echo "CONFIG_SPARD_WLAN_SUPPORT=y" >> .config
          echo "CONFIG_SPRDWL_NG=m" >> .config
          echo "CONFIG_WCN_BOOT=y" >> .config
          echo "CONFIG_RK_WIFI_DEVICE_UWE5621=m" >> .config
          make olddefconfig 2>&1 | tail -5
          grep -E "LOCALVERSION|SPARD|SPRDWL|WCN|UWE5621" .config
          make -j$(nproc) vmlinux 2>&1 | tail -20
          ls -la vmlinux && echo "vmlinux OK" || { echo "FAILED"; exit 1; }
          make -j$(nproc) modules_prepare 2>&1 | tail -8

      - name: Build cfg80211 in-tree
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          make -j$(nproc) M=net/wireless modules KBUILD_MODPOST_WARN=1 2>&1 | tail -20 || true
          cp net/wireless/Module.symvers . 2>/dev/null || true
          [ -f Module.symvers ] || touch Module.symvers
          echo "Symbols: $(wc -l < Module.symvers 2>/dev/null || echo 0)"

      - name: Build unisoc modules
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          UNISOC=drivers/net/wireless/unisoc
          echo "=== unisocwcn ==="
          make M=$UNISOC/unisocwcn modules KBUILD_MODPOST_WARN=1 2>&1 | tail -30 || true
          echo "=== unisocwifi ==="
          make M=$UNISOC/unisocwifi modules KBUILD_MODPOST_WARN=1 2>&1 | tail -30 || true
          KO_COUNT=$(find $UNISOC -name "*.ko" 2>/dev/null | wc -l)
          echo "=== Module count: $KO_COUNT ==="
          find $UNISOC -name "*.ko" -ls 2>/dev/null || echo "NONE"
          find $UNISOC -name "*.ko" 2>/dev/null | while read ko; do
            echo "--- $ko ---"
            modinfo "$ko" | grep -E "vermagic|depends|filename|license" || true
          done
          [ "$KO_COUNT" -eq 0 ] && { echo "FATAL: No modules built"; exit 1; }; true
          echo "=== Stripping BTF ==="
          for ko in $(find $UNISOC -name "*.ko"); do aarch64-linux-gnu-objcopy --remove-section=.BTF "$ko" 2>/dev/null || true; done
          echo "Done"

      - name: Build Image and DTB
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          make -j$(nproc) Image dtbs 2>&1 | tail -10
          ls -la arch/arm64/boot/Image || exit 1
          ls -la arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb || exit 1
          echo ""
          echo "=== v79: Verify DTB WiFi node (pinctrl SHOULD be present) ==="
          dtc -I dtb -O dts arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb 2>/dev/null | python3 -c "
          import sys; found = False
          for line in sys.stdin:
              if 'uwe-bsp@1' in line: found = True
              if found: sys.stdout.write(line)
              if found and '};' in line and 'uwe-bsp@1' not in line: found = False
          "
          echo ""
          echo "=== pinctrl in DTB (should show wifi_host_wake_irq) ==="
          dtc -I dtb -O dts arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb 2>/dev/null | grep -E "pinctrl-0|pinctrl-names|pub-int-gpio|wifi_host"

      - name: Package output
        run: |
          rm -rf output
          mkdir -p output/modules
          UNISOC=drivers/net/wireless/unisoc
          find $UNISOC -name "*.ko" 2>/dev/null | while read f; do
            dir="$(dirname "$f")"
            mkdir -p "output/modules/$dir"
            cp "$f" "output/modules/$dir/"
          done
          echo "Module count: $(find output/modules -name '*.ko' | wc -l)"
          find output/modules -name "*.ko" | while read ko; do basename "$ko"; done > output/modules/modules.order 2>/dev/null || true
          cp arch/arm64/boot/Image output/
          cp Module.symvers output/ 2>/dev/null || true
          echo "=== Package ==="
          find output -type f | sort
          echo "=== Sizes ==="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3528-sy910-wifi-modules
          path: output/

