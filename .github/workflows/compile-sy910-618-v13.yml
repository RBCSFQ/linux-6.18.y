name: Compile SY910 WiFi Module for 6.18.18.c821-trim (v13)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: RBCSFQ/linux-6.18.y
          ref: main
          fetch-depth: 0

      - name: Install dependencies (GCC 12 to match ophub)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12-aarch64-linux-gnu flex bison bc dwarves pahole libelf-dev
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ar aarch64-linux-gnu-gcc-ar /usr/bin/aarch64-linux-gnu-gcc-ar-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-nm aarch64-linux-gnu-gcc-nm /usr/bin/aarch64-linux-gnu-gcc-nm-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ranlib aarch64-linux-gnu-gcc-ranlib /usr/bin/aarch64-linux-gnu-gcc-ranlib-12 100
          aarch64-linux-gnu-gcc --version

      - name: Fix DTS (no DT changes in v10)
        run: |
          DTS_DIR=arch/arm64/boot/dts/rockchip
          DTS=$DTS_DIR/rk3528-sy910.dts
          sed -i "/rk3528-ddr4-lp3-v11/d" $DTS
          for LABEL in cpu0 gpu display_subsystem vop vop_mmu hdmi hdmi_in_vop usb2phy usbdrd30 usbdrd_dwc3 pcie2x1 rng sfc; do
            sed -i "/^&$LABEL {/,/^};$/d" $DTS
          done
          sed -i "/drm-logo@0 {/,/};$/d" $DTS
          sed -i "/drm-cubic-lut@0 {/,/};$/d" $DTS
          sed -i "s/clocks = <&xin24m>;//g" $DTS
          sed -i "s/pcfg_pull_none_schmitt/pcfg_pull_none/g" $DTS
          sed -i "/^[\t ]*reserved-memory {$/,/^[\t ]*};$/d" $DTS
          echo "v13: Bare platform device + parse_dt defaults (drvdata+blksz=512)"
          if ! grep -q "rk3528-sy910.dtb" $DTS_DIR/Makefile; then
            sed -i "/^dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3528-evb1-ddr4-v10.dtb/a dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3528-sy910.dtb" $DTS_DIR/Makefile
          fi

      - name: Patch unisoc drivers
        run: |
          DRV=drivers/net/wireless/unisoc/unisocwifi
          WCN=drivers/net/wireless/unisoc/unisocwcn
          SDIOHAL=$WCN/sdio/sdiohal_main.c
          sed -i "/struct sched_param param;/d" $WCN/sdio/sdiohal_tx.c
          sed -i "/struct sched_param param;/d" $WCN/sdio/sdiohal_rx.c
          sed -i "/param\.sched_priority = SDIO_TX_TASK_PRIO;/d" $WCN/sdio/sdiohal_tx.c
          sed -i "/param\.sched_priority = SDIO_RX_TASK_PRIO;/d" $WCN/sdio/sdiohal_rx.c
          sed -i "s#sched_setscheduler(current, SCHED_FIFO, &param);#sched_set_fifo(current);#" $WCN/sdio/sdiohal_tx.c
          sed -i "s#sched_setscheduler(current, SCHED_FIFO, &param);#sched_set_fifo(current);#" $WCN/sdio/sdiohal_rx.c
          sed -i "s/disable_irq_nosync(irq);/disable_irq(irq);/" $WCN/sleep/sdio_int.c || true
          sed -i "s/sdiohal_info(\"%s wait xmit_cnt:%d/sdiohal_debug(\"%s wait xmit_cnt:%d/" $SDIOHAL
          sed -i "s/sdiohal_info(\"%s wait xmit_cnt end/sdiohal_debug(\"%s wait xmit_cnt end/" $SDIOHAL
          sed -i "s#p_data->pwrseq = true;#p_data->pwrseq = false; /* RK3528 */#" $SDIOHAL
          sed -i "s#if (!p_data->pwrseq) {#if (1) { /* RK3528 always enable */#" $SDIOHAL
          sed -i "s/cfg80211_new_sta(vif->ndev,/cfg80211_new_sta(\&vif->wdev,/g" $DRV/cfg80211.c 2>/dev/null || true
          sed -i "s/cfg80211_del_sta(vif->ndev,/cfg80211_del_sta(\&vif->wdev,/g" $DRV/cfg80211.c 2>/dev/null || true
          sed -i "s/from_timer(priv, t, scan_timer)/container_of(t, struct sprdwl_priv, scan_timer)/g" $DRV/cfg80211.c 2>/dev/null || true
          sed -i "s/from_timer(ack_info, t, timer)/container_of(t, struct sprdwl_tcp_ack_info, timer)/g" $DRV/tcp_ack.c 2>/dev/null || true
          sed -i "s/from_timer(ba_node, t, reorder_timer)/container_of(t, struct rx_ba_node, reorder_timer)/g" $DRV/reorder.c 2>/dev/null || true
          sed -i "s/from_timer(priv, t, wmmac\.wmmac_edcaf_timer)/container_of(t, struct sprdwl_priv, wmmac.wmmac_edcaf_timer)/g" $DRV/qos.c
          for f in $DRV/cfg80211.c $DRV/tcp_ack.c $DRV/reorder.c $DRV/qos.c; do
            sed -i "s/\bdel_timer_sync\b/timer_delete_sync/g" "$f" 2>/dev/null || true
            sed -i "s/\bsetup_timer\b/timer_setup/g" "$f" 2>/dev/null || true
            sed -i "s/\bdel_timer\b/timer_delete/g" "$f" 2>/dev/null || true
          done
          find $DRV $WCN -name "*.c" -exec sed -i "/^MODULE_IMPORT_NS/d" {} \; 2>/dev/null || true
          echo "ccflags-y += -DCONFIG_RK_BOARD" >> $WCN/sdio/Makefile
          for d in $DRV $WCN $WCN/sdio $WCN/platform $WCN/sleep; do
            if [ -f "$d/Makefile" ]; then
              echo "subdir-ccflags-y := -w -Wno-implicit-function-declaration -Wno-incompatible-pointer-types" >> "$d/Makefile" 2>/dev/null || true
            fi
          done

      - name: Fix compatible + add bare platform device in marlin_init
        run: |
          python3 << 'PYEOF'
          fpath = "drivers/net/wireless/unisoc/unisocwcn/platform/wcn_boot.c"
          with open(fpath, "r") as f:
              content = f.read()

          # 1. Add include
          content = content.replace(
              "#include <linux/platform_device.h>",
              "#include <linux/platform_device.h>\n#include <linux/of_platform.h>"
          )

          # 2. Fix compatible: underscore -> hyphen
          content = content.replace('"unisoc,uwe_bsp"', '"unisoc,uwe-bsp"')
          
          # 2.5 NULL guard: insert after if (!p_data) return -ENOMEM in marlin_parse_dt
          #       Uses runtime find() to locate the correct insertion point
          pos = content.find('return -ENOMEM;')
          if pos >= 0:
              end = content.find('\n', pos) + 1
              guard = '\tplatform_set_drvdata(pdev, p_data);\n\tif (!np) {\n\t\tp_data->blksz = 512;\n\t\treturn 0;\n\t}\n'
              content = content[:end] + guard + content[end:]
              print("NULL guard inserted after return -ENOMEM;")
          else:
              print("WARNING: return -ENOMEM; not found!")
          


          # 3. Create bare platform device (no DT, no resources)
          #    Matches by driver name "uwe_bsp" -> triggers marlin_probe
          patch = '''
          \t{
          \t\tstruct platform_device *pdev = platform_device_alloc("uwe_bsp", PLATFORM_DEVID_NONE);
          \t\tif (pdev) {
          \t\t\tif (platform_device_add(pdev) == 0)
          \t\t\t\tWCN_INFO("marlin_init: bare platform device created\\n");
          \t\t\telse {
          \t\t\t\tWCN_ERR("marlin_init: platform_device_add failed\\n");
          \t\t\t\tplatform_device_put(pdev);
          \t\t\t}
          \t\t} else {
          \t\t\tWCN_ERR("marlin_init: platform_device_alloc failed\\n");
          \t\t}
          \t}
          '''

          old = 'WCN_INFO("marlin_init entry!\\n");'
          content = content.replace(old, old + "\n" + patch)

          with open(fpath, "w") as f:
              f.write(content)
          print("Patched wcn_boot.c OK")
          PYEOF
          echo "=== Verify ==="
          grep "p_data->blksz = 512" drivers/net/wireless/unisoc/unisocwcn/platform/wcn_boot.c && echo "blksz default OK" || echo "blksz MISSING!"
          grep "bare platform device" drivers/net/wireless/unisoc/unisocwcn/platform/wcn_boot.c
          grep "unisoc,uwe-bsp" drivers/net/wireless/unisoc/unisocwcn/platform/wcn_boot.c

      - name: Configure kernel (ophub config + build vmlinux)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 18/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = .c821-trim/" Makefile
          head -5 Makefile
          export LOCALVERSION=""
          KCONFIG_FILE=drivers/net/wireless/unisoc/Kconfig
          sed -i "/select RK_WIFI_DEVICE_UWE5621/d" $KCONFIG_FILE
          WCN_KCONFIG=drivers/net/wireless/unisoc/unisocwcn/Kconfig
          sed -i "s/bool \"Rockchip UWE5621 BSP Support\"/tristate \"Rockchip UWE5621 BSP Support\"/" $WCN_KCONFIG
          cp .github/config-6.18.18.c821-trim .config
          echo "CONFIG_SPARD_WLAN_SUPPORT=y" >> .config
          echo "CONFIG_SPRDWL_NG=m" >> .config
          echo "CONFIG_WCN_BOOT=y" >> .config
          echo "CONFIG_RK_WIFI_DEVICE_UWE5621=m" >> .config
          make olddefconfig 2>&1 | tail -5
          grep -E "LOCALVERSION|SPARD|SPRDWL|WCN|UWE5621" .config
          make -j$(nproc) vmlinux 2>&1 | tail -20
          ls -la vmlinux && echo "vmlinux built OK" || { echo "FAILED"; exit 1; }
          make -j$(nproc) modules_prepare 2>&1 | tail -8

      - name: Build cfg80211 in-tree (populate Module.symvers)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          make -j$(nproc) M=net/wireless modules KBUILD_MODPOST_WARN=1 2>&1 | tail -20 || true
          # Copy Module.symvers from cfg80211 build dir (avoids full make modules which fails on DVB drivers)
          cp net/wireless/Module.symvers . 2>/dev/null || true
          [ -f Module.symvers ] || touch Module.symvers
          echo "Symbols: $(wc -l < Module.symvers 2>/dev/null || echo 0)"

      - name: Build unisoc modules
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          UNISOC=drivers/net/wireless/unisoc
          echo "=== unisocwcn ==="
          make M=$UNISOC/unisocwcn modules KBUILD_MODPOST_WARN=1 2>&1 | tail -20 || true
          echo "=== unisocwifi ==="
          make M=$UNISOC/unisocwifi modules KBUILD_MODPOST_WARN=1 2>&1 | tail -20 || true
          KO_COUNT=$(find $UNISOC -name "*.ko" 2>/dev/null | wc -l)
          echo "=== Module count: $KO_COUNT ==="
          find $UNISOC -name "*.ko" -ls 2>/dev/null || echo "NONE"
          find $UNISOC -name "*.ko" 2>/dev/null | while read ko; do
            modinfo "$ko" | grep -E "vermagic|depends|filename|license"
          done
          [ "$KO_COUNT" -eq 0 ] && { echo "FATAL: No modules"; exit 1; }; true
          echo "=== Stripping BTF ==="
          for ko in $(find $UNISOC -name "*.ko"); do aarch64-linux-gnu-objcopy --remove-section=.BTF "$ko" 2>/dev/null || true; done
          echo "Done"

      - name: Build Image and DTB
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          make -j$(nproc) Image dtbs 2>&1 | tail -10
          ls -la arch/arm64/boot/Image || exit 1
          ls -la arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb || exit 1

      - name: Package output
        run: |
          rm -rf output
          mkdir -p output/modules
          UNISOC=drivers/net/wireless/unisoc
          find $UNISOC -name "*.ko" 2>/dev/null | while read f; do
            dir="$(dirname "$f")"
            mkdir -p "output/modules/$dir"
            cp "$f" "output/modules/$dir/"
          done
          echo "Module count: $(find output/modules -name "*.ko" | wc -l)"
          find output/modules -name "*.ko" | while read ko; do basename "$ko"; done > output/modules/modules.order 2>/dev/null || true
          cp arch/arm64/boot/Image output/
          cp arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb output/
          cp Module.symvers output/ 2>/dev/null || true
          cd output && zip -r ../rk3528-sy910-wifi-modules.zip .
          echo "Package: $(ls -lh ../rk3528-sy910-wifi-modules.zip)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3528-sy910-wifi-modules
          path: rk3528-sy910-wifi-modules.zip
