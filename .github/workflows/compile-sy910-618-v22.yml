name: Compile SY910 WiFi Module for 6.18.18.c951-trim (v22)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: RBCSFQ/linux-6.18.y
          ref: main
          fetch-depth: 0

      - name: Install dependencies (GCC 12 to match ophub)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12-aarch64-linux-gnu flex bison bc dwarves pahole libelf-dev device-tree-compiler
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ar aarch64-linux-gnu-gcc-ar /usr/bin/aarch64-linux-gnu-gcc-ar-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-nm aarch64-linux-gnu-gcc-nm /usr/bin/aarch64-linux-gnu-gcc-nm-12 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc-ranlib aarch64-linux-gnu-gcc-ranlib /usr/bin/aarch64-linux-gnu-gcc-ranlib-12 100
          aarch64-linux-gnu-gcc --version

      - name: "STEP 0: Inspect source - detect compatible string and code patterns"
        run: |
          echo "=============================================="
          echo "=== SOURCE INSPECTION (read-only) ==="
          echo "=============================================="
          WCN=drivers/net/wireless/unisoc/unisocwcn
          DRV=drivers/net/wireless/unisoc/unisocwifi
          DTS_DIR=arch/arm64/boot/dts/rockchip

          echo ""
          echo "=== 1. Driver compatible string in wcn_boot.c ==="
          grep -n "unisoc,uwe" $WCN/platform/wcn_boot.c || echo "NOT FOUND in wcn_boot.c"
          grep -rn "unisoc,uwe" $WCN/ || echo "NOT FOUND anywhere in unisocwcn/"

          echo ""
          echo "=== 2. DTS WiFi node ==="
          if [ -f "$DTS_DIR/rk3528-sy910.dts" ]; then
            grep -n "unisoc,uwe\|uwe.bsp\|uwe-bsp" $DTS_DIR/rk3528-sy910.dts
            echo "--- Full uwe node ---"
            sed -n '/uwe.bsp/,/};/p' $DTS_DIR/rk3528-sy910.dts | head -25
          else
            echo "ERROR: rk3528-sy910.dts NOT FOUND!"
            echo "Available rk3528 DTS files:"
            ls $DTS_DIR/rk3528*.dts 2>/dev/null | head -10
          fi

          echo ""
          echo "=== 3. marlin_parse_dt function signature and returns ==="
          grep -n "marlin_parse_dt\|return -1\|return -ENODEV" $WCN/platform/wcn_boot.c | head -30

          echo ""
          echo "=== 4. start_marlin function ==="
          grep -n -A5 "int start_marlin" $WCN/platform/wcn_boot.c | head -20

          echo ""
          echo "=== 5. clock_get patterns ==="
          grep -n "devm_clk_get\|clk_32k\|clk_parent\|clk_enable" $WCN/platform/wcn_boot.c | head -20

          echo ""
          echo "=== 6. get_loopcheck_status ==="
          grep -n -B1 -A5 "get_loopcheck_status" $WCN/platform/wcn_procfs.c | head -15

          echo ""
          echo "=== 7. sched_setscheduler usage ==="
          grep -rn "sched_setscheduler\|sched_param" $WCN/sdio/ | head -10

          echo ""
          echo "=== 8. pwrseq in sdiohal ==="
          grep -n "pwrseq" $WCN/sdio/sdiohal_main.c | head -10

          echo ""
          echo "=== 9. from_timer / del_timer usage in WiFi driver ==="
          grep -rn "from_timer\|del_timer\|setup_timer" $DRV/ 2>/dev/null | head -15

          echo ""
          echo "=== 10. MODULE_IMPORT_NS ==="
          grep -rn "MODULE_IMPORT_NS" $DRV/ $WCN/ 2>/dev/null | head -10

          echo ""
          echo "=== 11. Kernel config file existence ==="
          ls -la .github/config-6.18.18.c951-trim 2>/dev/null || echo "CONFIG FILE NOT FOUND!"

          echo ""
          echo "=== 12. Makefile head (version info) ==="
          head -5 Makefile

          echo ""
          echo "=============================================="
          echo "=== END INSPECTION ==="
          echo "=============================================="

      - name: "STEP 1: Fix DTS - ensure compatible matches driver"
        run: |
          DTS_DIR=arch/arm64/boot/dts/rockchip
          DTS=$DTS_DIR/rk3528-sy910.dts
          WCN=drivers/net/wireless/unisoc/unisocwcn

          # Detect what the DRIVER actually uses
          DRV_COMPAT=$(grep -oP '"unisoc,uwe[^"]*"' $WCN/platform/wcn_boot.c | head -1 | tr -d '"')
          echo "Driver compatible detected: '$DRV_COMPAT'"

          if [ -z "$DRV_COMPAT" ]; then
            echo "ERROR: Cannot detect driver compatible string!"
            grep -n "unisoc" $WCN/platform/wcn_boot.c | head -10
            exit 1
          fi

          # Detect what the DTS currently uses
          DTS_COMPAT=$(grep -oP '"unisoc,uwe[^"]*"' $DTS | head -1 | tr -d '"')
          echo "DTS compatible detected: '$DTS_COMPAT'"

          # Make DTS match driver (whatever the driver uses, DTS must match)
          if [ "$DRV_COMPAT" != "$DTS_COMPAT" ]; then
            echo "MISMATCH! Fixing DTS: '$DTS_COMPAT' -> '$DRV_COMPAT'"
            sed -i "s/\"unisoc,uwe[^\"]*\"/\"$DRV_COMPAT\"/" $DTS
          else
            echo "MATCH OK: both use '$DRV_COMPAT'"
          fi

          # Verify
          echo "After fix:"
          grep -n "unisoc,uwe" $DTS

          # Other DTS cleanups (remove nodes that reference undefined things)
          sed -i "/rk3528-ddr4-lp3-v11/d" $DTS
          for LABEL in cpu0 gpu display_subsystem vop vop_mmu hdmi hdmi_in_vop usb2phy usbdrd30 usbdrd_dwc3 pcie2x1 rng sfc; do
            sed -i "/^&$LABEL {/,/^};$/d" $DTS
          done
          sed -i "/drm-logo@0 {/,/};$/d" $DTS
          sed -i "/drm-cubic-lut@0 {/,/};$/d" $DTS
          sed -i "s/clocks = <&xin24m>;//g" $DTS
          sed -i "s/pcfg_pull_none_schmitt/pcfg_pull_none/g" $DTS
          sed -i "/^[\t ]*reserved-memory {$/,/^[\t ]*};$/d" $DTS

          # Ensure DTB is in Makefile
          if ! grep -q "rk3528-sy910.dtb" $DTS_DIR/Makefile; then
            sed -i "/^dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3528-evb1-ddr4-v10.dtb/a dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3528-sy910.dtb" $DTS_DIR/Makefile
          fi
          echo "DTS step complete"

      - name: "STEP 2: Patch unisoc drivers (API adaptation only)"
        run: |
          DRV=drivers/net/wireless/unisoc/unisocwifi
          WCN=drivers/net/wireless/unisoc/unisocwcn
          SDIOHAL=$WCN/sdio/sdiohal_main.c

          echo "=== Applying API adaptation patches ==="

          # sched_setscheduler -> sched_set_fifo (kernel 6.x API change)
          if grep -q "sched_setscheduler" $WCN/sdio/sdiohal_tx.c 2>/dev/null; then
            sed -i "/struct sched_param param;/d" $WCN/sdio/sdiohal_tx.c
            sed -i "/param\.sched_priority = SDIO_TX_TASK_PRIO;/d" $WCN/sdio/sdiohal_tx.c
            sed -i "s#sched_setscheduler(current, SCHED_FIFO, &param);#sched_set_fifo(current);#" $WCN/sdio/sdiohal_tx.c
            echo "  tx: sched patched"
          fi
          if grep -q "sched_setscheduler" $WCN/sdio/sdiohal_rx.c 2>/dev/null; then
            sed -i "/struct sched_param param;/d" $WCN/sdio/sdiohal_rx.c
            sed -i "/param\.sched_priority = SDIO_RX_TASK_PRIO;/d" $WCN/sdio/sdiohal_rx.c
            sed -i "s#sched_setscheduler(current, SCHED_FIFO, &param);#sched_set_fifo(current);#" $WCN/sdio/sdiohal_rx.c
            echo "  rx: sched patched"
          fi

          # disable_irq_nosync -> disable_irq (if needed)
          sed -i "s/disable_irq_nosync(irq);/disable_irq(irq);/" $WCN/sleep/sdio_int.c 2>/dev/null || true

          # Reduce log noise
          sed -i "s/sdiohal_info(\"%s wait xmit_cnt:%d/sdiohal_debug(\"%s wait xmit_cnt:%d/" $SDIOHAL 2>/dev/null || true
          sed -i "s/sdiohal_info(\"%s wait xmit_cnt end/sdiohal_debug(\"%s wait xmit_cnt end/" $SDIOHAL 2>/dev/null || true

          # pwrseq: RK3528 MMC core handles pwrseq, driver should not
          if grep -q "p_data->pwrseq = true;" $SDIOHAL 2>/dev/null; then
            sed -i "s#p_data->pwrseq = true;#p_data->pwrseq = false; /* RK3528: MMC core handles pwrseq */#" $SDIOHAL
            echo "  pwrseq=true patched"
          fi
          if grep -q "if (!p_data->pwrseq) {" $SDIOHAL 2>/dev/null; then
            sed -i "s#if (!p_data->pwrseq) {#if (1) { /* RK3528 always enable */#" $SDIOHAL
            echo "  pwrseq check patched"
          fi

          # cfg80211 API changes (6.x kernel)
          sed -i "s/cfg80211_new_sta(vif->ndev,/cfg80211_new_sta(\&vif->wdev,/g" $DRV/cfg80211.c 2>/dev/null || true
          sed -i "s/cfg80211_del_sta(vif->ndev,/cfg80211_del_sta(\&vif->wdev,/g" $DRV/cfg80211.c 2>/dev/null || true

          # Timer API changes (6.x kernel)
          sed -i "s/from_timer(priv, t, scan_timer)/container_of(t, struct sprdwl_priv, scan_timer)/g" $DRV/cfg80211.c 2>/dev/null || true
          sed -i "s/from_timer(ack_info, t, timer)/container_of(t, struct sprdwl_tcp_ack_info, timer)/g" $DRV/tcp_ack.c 2>/dev/null || true
          sed -i "s/from_timer(ba_node, t, reorder_timer)/container_of(t, struct rx_ba_node, reorder_timer)/g" $DRV/reorder.c 2>/dev/null || true
          sed -i "s/from_timer(priv, t, wmmac\.wmmac_edcaf_timer)/container_of(t, struct sprdwl_priv, wmmac.wmmac_edcaf_timer)/g" $DRV/qos.c 2>/dev/null || true
          for f in $DRV/cfg80211.c $DRV/tcp_ack.c $DRV/reorder.c $DRV/qos.c; do
            sed -i "s/\bdel_timer_sync\b/timer_delete_sync/g" "$f" 2>/dev/null || true
            sed -i "s/\bsetup_timer\b/timer_setup/g" "$f" 2>/dev/null || true
            sed -i "s/\bdel_timer\b/timer_delete/g" "$f" 2>/dev/null || true
          done

          # MODULE_IMPORT_NS removal (6.x kernel change)
          find $DRV $WCN -name "*.c" -exec sed -i "/^MODULE_IMPORT_NS/d" {} \; 2>/dev/null || true

          # Build flags
          echo "ccflags-y += -DCONFIG_RK_BOARD" >> $WCN/sdio/Makefile
          for d in $DRV $WCN $WCN/sdio $WCN/platform $WCN/sleep; do
            if [ -f "$d/Makefile" ]; then
              echo "subdir-ccflags-y := -w -Wno-implicit-function-declaration -Wno-incompatible-pointer-types" >> "$d/Makefile" 2>/dev/null || true
            fi
          done
          echo "=== API patches done ==="

      - name: "STEP 3: Patch wcn_procfs.c - NULL guard for get_loopcheck_status"
        run: |
          WCN=drivers/net/wireless/unisoc/unisocwcn
          FILE=$WCN/platform/wcn_procfs.c

          echo "=== Patching get_loopcheck_status NULL guard ==="
          # Use a more flexible approach - find the function and add guard
          python3 << 'PYEOF'
          import re
          fpath = "drivers/net/wireless/unisoc/unisocwcn/platform/wcn_procfs.c"
          with open(fpath, "r") as f:
              content = f.read()

          # Strategy: find get_loopcheck_status function and add NULL guard
          # Pattern 1: exact match (original approach)
          old = "int get_loopcheck_status(void)\n{\n\treturn mdbg_proc->fail_count;\n}"
          new = "int get_loopcheck_status(void)\n{\n\tif (!mdbg_proc) return 0;\n\treturn mdbg_proc->fail_count;\n}"
          if old in content:
              content = content.replace(old, new)
              print("Pattern 1 (exact tab) matched and patched")
          else:
              # Pattern 2: try with spaces
              old2 = "int get_loopcheck_status(void)\n{\n    return mdbg_proc->fail_count;\n}"
              new2 = "int get_loopcheck_status(void)\n{\n    if (!mdbg_proc) return 0;\n    return mdbg_proc->fail_count;\n}"
              if old2 in content:
                  content = content.replace(old2, new2)
                  print("Pattern 2 (spaces) matched and patched")
              else:
                  # Pattern 3: regex approach
                  pattern = r'(int get_loopcheck_status\(void\)\s*\{)\s*\n(\s*)(return mdbg_proc->fail_count;)'
                  match = re.search(pattern, content)
                  if match:
                      indent = match.group(2)
                      replacement = f"{match.group(1)}\n{indent}if (!mdbg_proc) return 0;\n{indent}{match.group(3)}"
                      content = content[:match.start()] + replacement + content[match.end():]
                      print("Pattern 3 (regex) matched and patched")
                  else:
                      # Show what's actually there
                      idx = content.find("get_loopcheck_status")
                      if idx >= 0:
                          snippet = content[idx:idx+200]
                          print(f"WARNING: Could not patch. Function context:\n{snippet}")
                      else:
                          print("WARNING: get_loopcheck_status not found in file!")
                      # Don't exit - this is non-fatal, module may still work
                      import sys
                      sys.exit(0)

          with open(fpath, "w") as f:
              f.write(content)

          # Verify
          if "if (!mdbg_proc)" in content:
              print("VERIFIED: NULL guard present")
          else:
              print("WARNING: NULL guard NOT confirmed")
          PYEOF

      - name: "STEP 4: Patch wcn_boot.c - clock tolerance + start_marlin guard"
        run: |
          WCN=drivers/net/wireless/unisoc/unisocwcn
          FILE=$WCN/platform/wcn_boot.c

          echo "=== Patching wcn_boot.c ==="
          python3 << 'PYEOF'
          import re, sys
          fpath = "drivers/net/wireless/unisoc/unisocwcn/platform/wcn_boot.c"
          with open(fpath, "r") as f:
              content = f.read()

          changes = []

          # 1. Add of_platform.h include if not present
          if "#include <linux/of_platform.h>" not in content:
              if "#include <linux/platform_device.h>" in content:
                  content = content.replace(
                      "#include <linux/platform_device.h>",
                      "#include <linux/platform_device.h>\n#include <linux/of_platform.h>"
                  )
                  changes.append("Added of_platform.h include")
              else:
                  changes.append("WARNING: platform_device.h not found, cannot add of_platform.h")

          # 2. DO NOT change compatible string - keep source as-is
          # Report what's there for verification
          compat_matches = re.findall(r'"unisoc,uwe[^"]*"', content)
          print(f"Driver compatible strings found: {compat_matches}")

          # 3. Clock tolerance: make clk_get failures non-fatal
          # Use regex to handle varying whitespace
          # Pattern: devm_clk_get(..., "clk_32k") followed by IS_ERR check with return -1
          clk_patterns = [
              ("clk_32k", r'(marlin_dev->clk_32k\s*=\s*devm_clk_get\([^;]+\);)\s*\n(\s*)if\s*\(IS_ERR\(marlin_dev->clk_32k\)\)\s*\{[^}]*return\s+-1;\s*\}'),
              ("source", r'(marlin_dev->clk_parent\s*=\s*devm_clk_get\([^;]+\);)\s*\n(\s*)if\s*\(IS_ERR\(marlin_dev->clk_parent\)\)\s*\{[^}]*return\s+-1;\s*\}\s*\n(\s*)clk_set_parent\(marlin_dev->clk_32k,\s*marlin_dev->clk_parent\);'),
              ("enable", r'(marlin_dev->clk_enable\s*=\s*devm_clk_get\([^;]+\);)\s*\n(\s*)if\s*\(IS_ERR\(marlin_dev->clk_enable\)\)\s*\{[^}]*return\s+-1;\s*\}'),
          ]

          for name, pattern in clk_patterns:
              match = re.search(pattern, content)
              if match:
                  indent = match.group(2)
                  if name == "clk_32k":
                      replacement = (f"{match.group(1)}\n"
                                    f"{indent}if (IS_ERR(marlin_dev->clk_32k)) {{\n"
                                    f"{indent}\tWCN_INFO(\"clk_32k not in DT\\n\");\n"
                                    f"{indent}\tmarlin_dev->clk_32k = NULL;\n"
                                    f"{indent}}}")
                      content = content[:match.start()] + replacement + content[match.end():]
                      changes.append(f"clk_32k: made non-fatal")
                  elif name == "source":
                      indent3 = match.group(3) if match.group(3) else indent
                      replacement = (f"{match.group(1)}\n"
                                    f"{indent}if (IS_ERR(marlin_dev->clk_parent)) {{\n"
                                    f"{indent}\tWCN_INFO(\"source clock not in DT\\n\");\n"
                                    f"{indent}\tmarlin_dev->clk_parent = NULL;\n"
                                    f"{indent}}}\n"
                                    f"{indent3}if (!IS_ERR_OR_NULL(marlin_dev->clk_32k) && !IS_ERR_OR_NULL(marlin_dev->clk_parent))\n"
                                    f"{indent3}\tclk_set_parent(marlin_dev->clk_32k, marlin_dev->clk_parent);")
                      content = content[:match.start()] + replacement + content[match.end():]
                      changes.append(f"clk_parent/source: made non-fatal + guarded clk_set_parent")
                  elif name == "enable":
                      replacement = (f"{match.group(1)}\n"
                                    f"{indent}if (IS_ERR(marlin_dev->clk_enable)) {{\n"
                                    f"{indent}\tWCN_INFO(\"enable clock not in DT\\n\");\n"
                                    f"{indent}\tmarlin_dev->clk_enable = NULL;\n"
                                    f"{indent}}}")
                      content = content[:match.start()] + replacement + content[match.end():]
                      changes.append(f"clk_enable: made non-fatal")
              else:
                  # Try simpler detection
                  if f'"{name}"' in content or (name == "source" and '"source"' in content):
                      changes.append(f"WARNING: {name} pattern found but regex didn't match exactly")
                  else:
                      changes.append(f"INFO: {name} clock not found in source (may not apply to this tree)")

          # 4. start_marlin NULL guard
          # Find start_marlin function and add guard after the #else branch
          if "if (!marlin_dev)" not in content:
              # Try multiple patterns for the start_marlin info message
              patterns_start = [
                  '#else\n\tWCN_INFO("%s [%s]\\n", __func__, strno(subsys));',
                  '#else\n\tWCN_INFO("%s [%s]\n", __func__, strno(subsys));',
              ]
              patched = False
              for pat in patterns_start:
                  if pat in content:
                      content = content.replace(pat, pat.replace('#else\n', '#else\n\tif (!marlin_dev) return -ENODEV;\n'))
                      changes.append("start_marlin: NULL guard added")
                      patched = True
                      break
              if not patched:
                  # Regex fallback: find WCN_INFO with __func__ and strno after #else
                  m = re.search(r'(#else\s*\n)(\s*)(WCN_INFO\("%s \[%s\]', content)
                  if m:
                      indent = m.group(2)
                      guard = f"{m.group(1)}{indent}if (!marlin_dev) return -ENODEV;\n{indent}"
                      content = content[:m.start()] + guard + content[m.start()+len(m.group(1))+len(m.group(2)):]
                      changes.append("start_marlin: NULL guard added (regex)")
                  else:
                      changes.append("WARNING: Could not add start_marlin NULL guard - pattern not found")
          else:
              changes.append("start_marlin: NULL guard already present")

          # 5. Make marlin_parse_dt return values non-fatal
          # Instead of blind sed, find the function and handle returns carefully
          # Only change "return -1" that are related to DT parsing failures
          # Strategy: within marlin_parse_dt function body, change return -1 to return 0
          parse_start = content.find("marlin_parse_dt")
          if parse_start >= 0:
              # Find function body (from first { to matching })
              brace_start = content.find("{", parse_start)
              if brace_start >= 0:
                  depth = 0
                  pos = brace_start
                  while pos < len(content):
                      if content[pos] == '{':
                          depth += 1
                      elif content[pos] == '}':
                          depth -= 1
                          if depth == 0:
                              break
                      pos += 1
                  func_body = content[brace_start:pos+1]
                  # Count return -1 in function
                  ret_count = func_body.count("return -1")
                  if ret_count > 0:
                      new_body = func_body.replace("return -1", "return 0 /* v22: non-fatal */")
                      content = content[:brace_start] + new_body + content[pos+1:]
                      changes.append(f"marlin_parse_dt: {ret_count} 'return -1' -> 'return 0' (non-fatal)")
                  else:
                      changes.append("marlin_parse_dt: no 'return -1' found (already non-fatal or different pattern)")
          else:
              changes.append("WARNING: marlin_parse_dt function not found!")

          with open(fpath, "w") as f:
              f.write(content)

          print("\n=== Changes applied ===")
          for c in changes:
              print(f"  {c}")
          print(f"\nTotal changes: {len(changes)}")
          PYEOF

          echo ""
          echo "=== Post-patch verification ==="
          grep -n "if (!marlin_dev)" $FILE | head -5
          grep -n "return 0 /\* v22" $FILE | head -10
          grep -n "clk_32k = NULL\|clk_parent = NULL\|clk_enable = NULL" $FILE | head -5
          echo "=== wcn_boot.c patch complete ==="

      - name: Configure kernel (ophub config + build vmlinux)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 18/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = .c951-trim/" Makefile
          head -5 Makefile
          export LOCALVERSION=""
          KCONFIG_FILE=drivers/net/wireless/unisoc/Kconfig
          sed -i "/select RK_WIFI_DEVICE_UWE5621/d" $KCONFIG_FILE
          WCN_KCONFIG=drivers/net/wireless/unisoc/unisocwcn/Kconfig
          sed -i "s/bool \"Rockchip UWE5621 BSP Support\"/tristate \"Rockchip UWE5621 BSP Support\"/" $WCN_KCONFIG
          cp .github/config-6.18.18.c951-trim .config
          echo "CONFIG_SPARD_WLAN_SUPPORT=y" >> .config
          echo "CONFIG_SPRDWL_NG=m" >> .config
          echo "CONFIG_WCN_BOOT=y" >> .config
          echo "CONFIG_RK_WIFI_DEVICE_UWE5621=m" >> .config
          make olddefconfig 2>&1 | tail -5
          grep -E "LOCALVERSION|SPARD|SPRDWL|WCN|UWE5621" .config
          make -j$(nproc) vmlinux 2>&1 | tail -20
          ls -la vmlinux && echo "vmlinux built OK" || { echo "FAILED"; exit 1; }
          make -j$(nproc) modules_prepare 2>&1 | tail -8

      - name: Build cfg80211 in-tree (populate Module.symvers)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          make -j$(nproc) M=net/wireless modules KBUILD_MODPOST_WARN=1 2>&1 | tail -20 || true
          cp net/wireless/Module.symvers . 2>/dev/null || true
          [ -f Module.symvers ] || touch Module.symvers
          echo "Symbols: $(wc -l < Module.symvers 2>/dev/null || echo 0)"

      - name: Build unisoc modules
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          UNISOC=drivers/net/wireless/unisoc
          echo "=== unisocwcn ==="
          make M=$UNISOC/unisocwcn modules KBUILD_MODPOST_WARN=1 2>&1 | tail -30 || true
          echo "=== unisocwifi ==="
          make M=$UNISOC/unisocwifi modules KBUILD_MODPOST_WARN=1 2>&1 | tail -30 || true
          KO_COUNT=$(find $UNISOC -name "*.ko" 2>/dev/null | wc -l)
          echo "=== Module count: $KO_COUNT ==="
          find $UNISOC -name "*.ko" -ls 2>/dev/null || echo "NONE"
          find $UNISOC -name "*.ko" 2>/dev/null | while read ko; do
            echo "--- $ko ---"
            modinfo "$ko" | grep -E "vermagic|depends|filename|license"
          done
          [ "$KO_COUNT" -eq 0 ] && { echo "FATAL: No modules built"; exit 1; }; true
          echo "=== Stripping BTF ==="
          for ko in $(find $UNISOC -name "*.ko"); do aarch64-linux-gnu-objcopy --remove-section=.BTF "$ko" 2>/dev/null || true; done
          echo "Done"

      - name: Build Image and DTB
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""
          make -j$(nproc) Image dtbs 2>&1 | tail -10
          ls -la arch/arm64/boot/Image || exit 1
          ls -la arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb || exit 1
          echo "=== Verify DTB WiFi node ==="
          dtc -I dtb -O dts arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb 2>/dev/null | grep -B2 -A10 "unisoc,uwe" || echo "dtc verify skipped"

      - name: Package output
        run: |
          rm -rf output
          mkdir -p output/modules
          UNISOC=drivers/net/wireless/unisoc
          find $UNISOC -name "*.ko" 2>/dev/null | while read f; do
            dir="$(dirname "$f")"
            mkdir -p "output/modules/$dir"
            cp "$f" "output/modules/$dir/"
          done
          echo "Module count: $(find output/modules -name "*.ko" | wc -l)"
          find output/modules -name "*.ko" | while read ko; do basename "$ko"; done > output/modules/modules.order 2>/dev/null || true
          cp arch/arm64/boot/Image output/
          cp arch/arm64/boot/dts/rockchip/rk3528-sy910.dtb output/
          cp Module.symvers output/ 2>/dev/null || true
          cd output && zip -r ../rk3528-sy910-wifi-modules.zip .
          echo "Package: $(ls -lh ../rk3528-sy910-wifi-modules.zip)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3528-sy910-wifi-modules
          path: rk3528-sy910-wifi-modules.zip
